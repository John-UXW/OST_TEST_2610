<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통테4차 통합테스트 진행판</title>
<style>
/* =========================================================
   통합테스트 진행판 — 화면 디자인 규격(2026-10-07) 적용
   색은 :root 토큰으로만 선언, 컴포넌트에는 var(--…)만 사용
   ========================================================= */
:root{
  --fs:16px;
  --bg:#F7F9FC; --surface:#FFFFFF; --surface-2:#F5F8FC; --surface-3:#EBF1F8;
  --line:#DCE4EE; --line-soft:#EAEFF6;
  --ink:#111820; --ink-2:#33404E; --muted:#64717F;
  --accent:#1766A6; --accent-ink:#FFFFFF; --accent-soft:#DCEBFA;
  --pass:#17804F; --pass-soft:#D8F3E4; --fail:#CC3327; --fail-soft:#FDE4E1;
  --na:#B07708; --na-soft:#FCF0D7; --todo:#9CAAB8; --todo-soft:#E9EEF4;
  --radius:10px;
  --shadow:0 1px 2px rgba(18,25,32,.06), 0 6px 18px rgba(18,25,32,.05);
  --mono:Consolas,"D2Coding",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1118; --surface:#151D26; --surface-2:#1B2531; --surface-3:#232F3D;
    --line:#2D3A49; --line-soft:#212C39;
    --ink:#E7EDF4; --ink-2:#C3CEDA; --muted:#94A3B2;
    --accent:#5FB2E8; --accent-ink:#07131D; --accent-soft:#143349;
    --pass:#4DC98A; --fail:#F47B6E; --na:#E3B55F; --todo:#67768A;
    --pass-soft:#113224; --fail-soft:#361B18; --na-soft:#31290F; --todo-soft:#222D3A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1118; --surface:#151D26; --surface-2:#1B2531; --surface-3:#232F3D;
  --line:#2D3A49; --line-soft:#212C39;
  --ink:#E7EDF4; --ink-2:#C3CEDA; --muted:#94A3B2;
  --accent:#5FB2E8; --accent-ink:#07131D; --accent-soft:#143349;
  --pass:#4DC98A; --fail:#F47B6E; --na:#E3B55F; --todo:#67768A;
  --pass-soft:#113224; --fail-soft:#361B18; --na-soft:#31290F; --todo-soft:#222D3A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
/* ---- 수행모듈 색 (§3.1) ---- */
.m-SD{--mc:#1D4FD7;--mcs:#E2EAFF} .m-MM{--mc:#C2410C;--mcs:#FEE9DC} .m-PP{--mc:#15803D;--mcs:#DCF5E5}
.m-QM{--mc:#7C3AED;--mcs:#EEE6FE} .m-FI{--mc:#0E7490;--mcs:#DBF1F7} .m-CO{--mc:#0369A1;--mcs:#DDEDF9}
.m-LE{--mc:#A16207;--mcs:#FBF0D4} .m-TR{--mc:#BE185D;--mcs:#FCE2EC} .m-WM{--mc:#047857;--mcs:#D7F3E8}
.m-PM{--mc:#B45309;--mcs:#FCEBD6} .m-NONE{--mc:#64717F;--mcs:#E9EEF4}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .m-SD{--mc:#8AA9FF;--mcs:#16224A} :root:not([data-theme="light"]) .m-MM{--mc:#FBA97A;--mcs:#3A1E0E}
  :root:not([data-theme="light"]) .m-PP{--mc:#6FD898;--mcs:#0F2E1E} :root:not([data-theme="light"]) .m-QM{--mc:#C0A4FB;--mcs:#271643}
  :root:not([data-theme="light"]) .m-FI{--mc:#6FC9DE;--mcs:#0D2C36} :root:not([data-theme="light"]) .m-CO{--mc:#6FB6E4;--mcs:#0D2436}
  :root:not([data-theme="light"]) .m-LE{--mc:#E0BC63;--mcs:#2E240B} :root:not([data-theme="light"]) .m-TR{--mc:#F291B6;--mcs:#391324}
  :root:not([data-theme="light"]) .m-WM{--mc:#5CCCA3;--mcs:#0A2A20} :root:not([data-theme="light"]) .m-PM{--mc:#E6AE68;--mcs:#331F09}
  :root:not([data-theme="light"]) .m-NONE{--mc:#9BA8B7;--mcs:#232D3A} }
:root[data-theme="dark"] .m-SD{--mc:#8AA9FF;--mcs:#16224A} :root[data-theme="dark"] .m-MM{--mc:#FBA97A;--mcs:#3A1E0E}
:root[data-theme="dark"] .m-PP{--mc:#6FD898;--mcs:#0F2E1E} :root[data-theme="dark"] .m-QM{--mc:#C0A4FB;--mcs:#271643}
:root[data-theme="dark"] .m-FI{--mc:#6FC9DE;--mcs:#0D2C36} :root[data-theme="dark"] .m-CO{--mc:#6FB6E4;--mcs:#0D2436}
:root[data-theme="dark"] .m-LE{--mc:#E0BC63;--mcs:#2E240B} :root[data-theme="dark"] .m-TR{--mc:#F291B6;--mcs:#391324}
:root[data-theme="dark"] .m-WM{--mc:#5CCCA3;--mcs:#0A2A20} :root[data-theme="dark"] .m-PM{--mc:#E6AE68;--mcs:#331F09}
:root[data-theme="dark"] .m-NONE{--mc:#9BA8B7;--mcs:#232D3A}
/* ---- 시나리오 카드 색 (§3.2) ---- */
.a0{--cc:#1766A6}.a1{--cc:#C2410C}.a2{--cc:#15803D}.a3{--cc:#7C3AED}.a4{--cc:#0E7490}.a5{--cc:#BE185D}
.a6{--cc:#1D4FD7}.a7{--cc:#A16207}.a8{--cc:#047857}.a9{--cc:#9333EA}.a10{--cc:#B45309}.a11{--cc:#0369A1}
/* ---- 구분 탭 색 (§3.3) ---- */
.k-ALL{--kc:#475569} .k-E2E{--kc:#1766A6} .k-CO{--kc:#0369A1}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.55;
  font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* ---- 버튼 (§7.1) ---- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:.38em .8em;font-size:.82em;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.mini-b{border:0;background:none;font-size:.66em;color:var(--muted);cursor:pointer;padding:.2em .5em;border-radius:6px}
.mini-b:hover{background:var(--surface-3);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:.3em;border-radius:99px;padding:.12em .7em;font-size:.72em;background:var(--surface-3);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.mbadge{font-family:var(--mono);font-size:.66em;font-weight:700;background:var(--mc,var(--ink-2));color:#fff;border-radius:4px;padding:.05em .4em}
:root[data-theme="dark"] .mbadge{color:#0C1118}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mbadge{color:#0C1118}}
input.fld,textarea.fld,select.fld{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:.36em .6em;font-size:.82em;width:100%}
textarea.fld{resize:vertical;min-height:2.6em;line-height:1.5}
input.fld:disabled,textarea.fld:read-only{background:var(--surface-2);color:var(--muted)}

/* ---- 상단바 ---- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-in{max-width:1680px;margin:0 auto;padding:.6em 1.2em;display:flex;align-items:center;gap:.7em;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6em;cursor:pointer;min-width:0}
.brand b{font-size:1.02em;letter-spacing:-.015em;white-space:nowrap}
.brand .logo{font-family:var(--mono);font-size:.7em;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:.25em .5em}
.top .sp{flex:1}
.top .grp{display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.top input.fld{width:auto}
.top .date{width:9.4em}.top .tester{width:10.5em}
.sync{display:inline-flex;align-items:center;gap:.4em;font-size:.72em;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--todo)}
.sync.ok::before{background:var(--pass)} .sync.busy::before{background:var(--na)} .sync.err::before{background:var(--fail)}
.sync.err{color:var(--fail)}
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:.4em;min-width:13em;z-index:40;display:flex;flex-direction:column}
details.menu .pop button{border:0;background:none;text-align:left;padding:.5em .7em;border-radius:6px;cursor:pointer;font-size:.84em}
details.menu .pop button:hover{background:var(--surface-3);color:var(--accent)}
details.menu .pop .who{font-size:.74em;color:var(--muted);padding:.4em .7em;border-bottom:1px solid var(--line-soft);margin-bottom:.2em}

/* ---- 진행 막대 (§7.3) ---- */
.segbar{display:flex;height:10px;border-radius:99px;background:var(--todo-soft);overflow:hidden;min-width:60px}
.segbar i{display:block;height:100%;transition:width .35s ease}
.segbar .p{background:var(--pass)} .segbar .f{background:var(--fail)} .segbar .n{background:var(--na)}
.segbar.sm{height:4px} .segbar.xs{height:3px}
.cnts{display:flex;gap:.9em;align-items:baseline;flex-wrap:wrap;font-size:.8em;color:var(--muted)}
.cnts b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.28em;color:var(--ink);margin-right:.15em}
.cnts .sq{display:inline-block;width:.6em;height:.6em;border-radius:2px;margin-right:.3em}
.cnts .pct b{font-size:1.6em}

/* ---- 홈 ---- */
.wrap{max-width:1320px;margin:0 auto;padding:1.4em 1.2em 4em}
.home h1{font-size:1.5em;letter-spacing:-.025em;margin:.2em 0 .1em}
.home .sub{color:var(--muted);font-size:.84em;margin-bottom:1em}
.overall{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1em 1.2em;box-shadow:var(--shadow);margin-bottom:1.1em;display:grid;grid-template-columns:1fr;gap:.6em}
.ktabs{display:inline-flex;gap:.25em;background:var(--surface-3);border-radius:99px;padding:.25em;margin:.4em 0 1em}
.ktab{border:0;background:none;border-radius:99px;padding:.35em 1em;font-size:.84em;font-weight:700;color:var(--ink-2);cursor:pointer}
.ktab[aria-selected="true"]{background:var(--kc);color:#fff}
.ktab .c{font-family:var(--mono);font-weight:400;opacity:.8;margin-left:.35em;font-size:.9em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1em}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1em 1.1em 1em 1.35em;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:.45em;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc)}
.card.done::before{background:var(--pass)} .card.bad::before{background:var(--fail)} .card.part::before{background:var(--accent)}
.card:hover{border-color:var(--accent)}
.card .id{font-family:var(--mono);font-weight:700;font-size:1.12em;color:var(--cc);letter-spacing:-.01em}
.card .nm{font-weight:700;letter-spacing:-.01em}
.card .meta{font-size:.76em;color:var(--muted)}
.card .empty{font-size:.76em;color:var(--muted);border:1px dashed var(--line);border-radius:7px;padding:.3em .6em;background:var(--surface-2)}
.hint2{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--radius) var(--radius) 0;padding:.8em 1em;font-size:.84em;margin:1.4em 0 1em}
.hint2 ol{margin:.3em 0 0;padding-left:1.3em}
details.vdet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:.7em 0}
details.vdet>summary{list-style:none;cursor:pointer;padding:.7em 1em;font-weight:700;font-size:.9em;display:flex;align-items:center;gap:.6em}
details.vdet>summary::-webkit-details-marker{display:none}
details.vdet>summary::before{content:"▸";color:var(--muted)}
details.vdet[open]>summary::before{content:"▾"}
details.vdet>.in{padding:0 1em 1em;font-size:.86em}
.badge{font-family:var(--mono);font-size:.72em;font-weight:400;border-radius:99px;padding:.1em .6em;background:var(--surface-3);color:var(--muted)}
.badge.on{background:var(--accent-soft);color:var(--accent)}
table.t{border-collapse:collapse;width:100%;font-size:.86em}
table.t th,table.t td{border-bottom:1px solid var(--line-soft);padding:.45em .55em;text-align:left;vertical-align:top}
table.t th{background:var(--surface-2);color:var(--muted);font-weight:700;font-size:.86em;white-space:nowrap}
.tscroll{overflow-x:auto}
.dots{display:flex;gap:.25em;flex-wrap:wrap}
.dot{font-size:.78em;padding:0 .4em;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.dot.off{background:transparent;color:var(--muted);opacity:.45;text-decoration:line-through}

/* ---- 메모 ---- */
.memo{margin-top:.8em;border:1px solid var(--line);border-left:4px solid var(--ink-2);background:var(--surface-2);border-radius:0 var(--radius) var(--radius) 0;padding:.5em .7em}
.memo .lb{display:flex;justify-content:space-between;gap:.6em;font-size:.72em;font-weight:700;color:var(--ink-2)}
.memo .lb .mt{font-weight:400;color:var(--muted)} .memo .lb .mt.remote{color:var(--accent);font-weight:700}
.memo textarea{width:100%;border:0;background:transparent;resize:vertical;min-height:2.8em;font-size:.86em;line-height:1.55;outline:none;padding:.2em 0}

/* ---- 시나리오 화면 ---- */
.scn{max-width:1680px;margin:0 auto;padding:0 1.2em 4em}
.shead{position:sticky;top:var(--toph,56px);z-index:20;background:var(--bg);padding:.8em 0 .6em;border-bottom:1px solid var(--line)}
.shead .r1{display:flex;align-items:center;gap:.7em;flex-wrap:wrap}
.shead .sid{font-family:var(--mono);font-weight:700;font-size:1.12em;color:var(--cc);border:1.5px solid var(--cc);border-radius:7px;padding:.05em .5em}
.shead .snm{font-size:1.18em;font-weight:700;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--surface-3);border-radius:8px;padding:.2em;gap:.2em}
.seg button{border:0;background:none;border-radius:6px;padding:.3em .85em;font-size:.82em;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.shead .r2{display:grid;grid-template-columns:1fr auto;gap:1em;align-items:center;margin-top:.6em}
.shead .r3{display:flex;gap:.4em;align-items:center;flex-wrap:wrap;margin-top:.6em}
.mchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.2em .75em;font-size:.76em;cursor:pointer;display:inline-flex;gap:.35em;align-items:center}
.mchip .c{font-family:var(--mono);color:var(--muted)}
.mchip[aria-pressed="true"]{background:var(--mcs,var(--accent-soft));border-color:var(--mc,var(--accent));color:var(--mc,var(--accent));font-weight:700}
.shead input.q{flex:1;min-width:14em;max-width:24em;margin-left:auto}
.body2{display:grid;grid-template-columns:274px 1fr;gap:1.2em;margin-top:1em}
.rail{position:sticky;top:var(--railtop,152px);align-self:start;max-height:calc(100vh - var(--railtop,152px) - 16px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.5em}
.rail .rh{font-size:.72em;font-weight:700;color:var(--muted);padding:.3em .5em}
.rail a{display:block;padding:.45em .55em;border-radius:7px;text-decoration:none;color:var(--ink-2);font-size:.8em;cursor:pointer;border-left:3px solid transparent}
.rail a:hover{background:var(--surface-2)}
.rail a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent);font-weight:700}
.rail a .rr{display:flex;justify-content:space-between;gap:.5em}
.rail a .rr .c{font-family:var(--mono);font-size:.9em;color:var(--muted);white-space:nowrap}
.rail a .segbar{margin-top:.3em}
.main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1em 1.2em;box-shadow:var(--shadow);margin-bottom:1em}
.panel h2{font-size:1.02em;margin:0 0 .7em;letter-spacing:-.01em;display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.panel h2 .s{font-size:.76em;font-weight:400;color:var(--muted)}

/* 단위업무 묶음 */
.unit{scroll-margin-top:var(--jump,168px);margin-bottom:1.4em}
.unit-h{display:flex;align-items:center;gap:.7em;flex-wrap:wrap;padding:.5em .2em;border-bottom:2px solid var(--ink-2);margin-bottom:.6em}
.unit-h h3{margin:0;font-size:1em;letter-spacing:-.015em}
.unit-h .c{font-family:var(--mono);font-size:.78em;color:var(--muted)}
.unit-h .segbar{width:140px;margin-left:auto}
.unit.hide{display:none}

/* ---- Activity 행 (§7.4) ---- */
.step{display:grid;grid-template-columns:54px 1fr 310px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--todo-soft);border-radius:var(--radius);margin-bottom:.55em;overflow:hidden;scroll-margin-top:calc(var(--jump,168px) + 20px)}
.step.v-Pass{border-left-color:var(--pass)} .step.v-Fail{border-left-color:var(--fail)} .step.v-NA{border-left-color:var(--na)}
.step.flash{box-shadow:0 0 0 3px var(--accent-soft)}
.step .no{background:var(--mcs,var(--surface-2));display:flex;flex-direction:column;align-items:center;gap:.35em;padding:.7em .2em;font-family:var(--mono);font-weight:700;font-size:.9em;color:var(--ink-2)}
.step .ct{padding:.7em .9em;min-width:0}
.step .ct .nm{font-weight:700;letter-spacing:-.01em}
.step .ct .aid{font-family:var(--mono);font-size:.74em;color:var(--muted);margin-left:.4em;font-weight:400}
.step .ct .unitnm{font-size:.74em;color:var(--muted)}
.tags{display:flex;gap:.35em;flex-wrap:wrap;margin:.35em 0}
.tag{font-size:.72em;border:1px solid var(--line);border-radius:6px;padding:.05em .5em;color:var(--ink-2);background:var(--surface-2)}
.tag.tc{font-family:var(--mono);color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.tag.warn{color:var(--na);background:var(--na-soft);border-color:var(--na-soft)}
.cp{font-size:.87em;color:var(--ink-2);white-space:pre-wrap}
.cp .k{font-size:.84em;font-weight:700;color:var(--muted);margin-right:.4em}
.cp.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.step .side{border-left:1px solid var(--line-soft);background:var(--surface-2);padding:.6em .7em;display:flex;flex-direction:column;gap:.4em}
.vbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em}
.vb{border:1.5px solid var(--line);background:var(--surface);border-radius:7px;padding:.35em 0;font-size:.82em;font-weight:700;color:var(--muted);cursor:pointer}
.vb:hover{border-color:var(--ink-2);color:var(--ink-2)}
.vb[aria-pressed="true"].Pass{background:var(--pass-soft);border-color:var(--pass);color:var(--pass)}
.vb[aria-pressed="true"].Fail{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.vb[aria-pressed="true"].NA{background:var(--na-soft);border-color:var(--na);color:var(--na)}
.vb:disabled{cursor:default;opacity:.7}
.fwrap .fl{display:flex;justify-content:space-between;font-size:.68em;font-weight:700;color:var(--muted)}
.fwrap .nonebox{border:1px dashed var(--line);background:var(--surface-2);color:var(--muted);border-radius:7px;padding:6px 10px;font-size:.82em;display:flex;justify-content:space-between;gap:.5em}
.run{font-family:var(--mono);font-size:.68em;color:var(--muted)}
.step .xtra{display:flex;flex-direction:column;gap:.4em}

/* ---- 개요 트리 ---- */
.meta-grid{display:grid;grid-template-columns:8em 1fr;gap:.35em 1em;font-size:.86em;margin:0 0 .8em}
.meta-grid dt{color:var(--muted)} .meta-grid dd{margin:0}
.sumbox{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:.6em .9em;margin:.4em 0 .9em;font-size:.9em}
.tree details{margin:.1em 0}
.tree summary{cursor:pointer;list-style:none;padding:.2em 0;font-weight:700}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸ ";color:var(--muted)} .tree details[open]>summary::before{content:"▾ "}
.tree .kids{margin-left:.5em;padding-left:1em;border-left:1px dashed var(--line)}
.tree .leaf{padding:.15em 0 .15em 1.2em;position:relative;font-size:.92em}
.tree .leaf::before{content:attr(data-k);position:absolute;left:0;color:var(--accent);font-size:.8em;top:.35em}
.tree .h2{font-weight:700;padding:.2em 0}

/* ---- 흐름도 / 스윔레인 (§7.6) ---- */
.map-tools{display:flex;gap:.4em;flex-wrap:wrap;align-items:center;margin-bottom:.6em}
.map-tools .lg{margin-left:auto;display:flex;gap:.9em;flex-wrap:wrap;font-size:.72em;color:var(--muted);align-items:center}
.map-tools .lg i{display:inline-block;width:1.1em;height:.75em;border-radius:3px;border:2px solid var(--line);vertical-align:-1px;margin-right:.3em;background:var(--surface)}
.map-tools .lg i.p{border-color:var(--pass)} .map-tools .lg i.f{border-color:var(--fail)} .map-tools .lg i.n{border-color:var(--na)}
.pager{margin-left:auto;display:inline-flex;align-items:center;gap:.4em;font-size:.8em;font-weight:400}
.pager .pb{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:2.2em;height:2em;cursor:pointer;color:var(--ink-2);font-size:1em}
.pager .pb:hover:not(:disabled){border-color:var(--accent);color:var(--accent)} .pager .pb:disabled{opacity:.35;cursor:default}
.pager .pn{font-family:var(--mono);color:var(--muted);min-width:3.6em;text-align:center}
.pager .pt{font-weight:700;color:var(--ink);max-width:22em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);max-height:76vh;position:relative;min-height:120px}
.map-scroll.full{position:fixed;inset:12px;z-index:70;max-height:none;box-shadow:var(--shadow)}
.map-canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.lane{position:absolute;left:0;border-bottom:1px solid var(--line-soft)}
.lane.alt{background:var(--surface)}
.lane-l{position:sticky;left:0;z-index:4;width:118px;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12px;color:var(--accent);background:var(--accent-soft);border-right:2px solid var(--accent);padding:0 6px}
.msec{position:absolute;top:0;border-left:1px dashed var(--line);border-right:1px dashed var(--line);pointer-events:none}
.msec-h{position:absolute;inset:0 0 auto 0;height:48px;padding:5px 8px;background:var(--surface);border-bottom:2px solid var(--ink-2);font-size:12px;font-weight:700;line-height:1.3;overflow:hidden;pointer-events:auto;cursor:pointer}
.msec-h:hover{background:var(--accent-soft)}
.msec-h .c{display:block;font-weight:400;color:var(--muted);font-size:11px;font-family:var(--mono)}
.mbox{position:absolute;z-index:3;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:5px 7px 4px;cursor:pointer;font-size:11.5px;line-height:1.3;display:flex;flex-direction:column;overflow:hidden}
.mbox:hover{border-color:var(--accent)}
.mbox.Pass{border:2px solid var(--pass)} .mbox.Fail{border:2px solid var(--fail)} .mbox.NA{border:2px solid var(--na)}
.mbox .v{position:absolute;right:4px;bottom:3px;font-size:10px;font-weight:700;font-family:var(--mono)}
.mbox.Pass .v{color:var(--pass)} .mbox.Fail .v{color:var(--fail)} .mbox.NA .v{color:var(--na)}
.mbox .n{padding-right:18px;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mbox .s{font-family:var(--mono);color:var(--muted);margin-right:4px}
.mbox .tcd{margin-top:auto;font-family:var(--mono);font-size:10.5px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.mbox .mt{position:absolute;top:4px;right:4px;font-family:var(--mono);font-size:9px;font-weight:700;background:var(--mcs);color:var(--mc);border-radius:3px;padding:0 3px}
.msvg{position:absolute;left:0;top:0;z-index:2;pointer-events:none;overflow:visible}
.msvg path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.msvg path.x{stroke-dasharray:3 6;stroke-width:2}
.msvg marker path{fill:var(--line);stroke:none}

/* ---- 맵 줄바꿈 · 병렬 흐름 ---- */
.mrowh{position:absolute;left:0}
.mrowh>span{position:sticky;left:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;width:118px;height:100%;padding:0 4px 6px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;line-height:1.25}
.mrowh>span b{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 7px;font-size:11px}
.mstage{position:absolute;left:0;display:flex;align-items:center;border-top:2px solid var(--ink-2);background:var(--surface)}
.mstage>span{position:sticky;left:10px;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;padding:0 4px}
.mstage>span em{font-style:normal;font-weight:400;color:var(--muted);margin-left:6px}
.mtrk{position:absolute;left:0;width:5px;z-index:5;background:var(--accent);border-radius:0 3px 3px 0}
.msvg path.w{stroke:var(--accent);stroke-width:2;opacity:.6}
.msvg path.x.w{stroke:var(--line);opacity:1}
.flow-edit{border:1px dashed var(--line);border-radius:var(--radius);padding:.7em .9em;margin-bottom:.7em;background:var(--surface)}
.flow-edit .fh{display:flex;gap:.6em;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.8em;margin-bottom:.4em}
.flow-edit .fr{display:grid;grid-template-columns:minmax(12em,1fr) 17em;gap:.6em;align-items:center;padding:.25em 0;border-bottom:1px solid var(--line-soft);font-size:.8em}
.flow-edit .fr:last-of-type{border-bottom:0}
.flow-edit .ft{font-size:.74em;color:var(--muted);margin-top:.4em}

/* ---- 발표 모드 ---- */
#pres{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;padding:1.2em}
.pres-in{max-width:1560px;margin:0 auto}
.pres-top{display:flex;align-items:center;gap:.7em;flex-wrap:wrap}
.pres-top .keys{margin-left:auto;font-size:.78em;color:var(--muted);display:flex;gap:.6em;align-items:center}
.kbd{font-family:var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .4em;background:var(--surface);color:var(--ink-2)}
.stepchips{display:flex;gap:.4em;overflow-x:auto;padding:.7em 0}
.stepchip{flex:0 0 auto;min-width:8.5em;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.4em .6em;cursor:pointer;text-align:left}
.stepchip .k{font-family:var(--mono);font-size:.66em;color:var(--muted)}
.stepchip .t{font-size:.78em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12em}
.stepchip .segbar{margin-top:.3em}
.stepcol{flex:0 0 auto;display:flex;flex-direction:column;gap:.25em}
.sreset{align-self:stretch;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.12em .5em;font-size:.68em;color:var(--muted);cursor:pointer;white-space:nowrap}
.sreset:hover:not(:disabled){border-color:var(--fail);color:var(--fail);background:var(--fail-soft)}
.sreset:disabled{opacity:.35;cursor:default}
.stepchip[aria-current="true"]{background:var(--ink-2);border-color:var(--ink-2);color:var(--surface)}
.stepchip[aria-current="true"] .k{color:var(--surface)}
.pres-grid{display:grid;grid-template-columns:1.85fr .8fr;gap:1.2em;margin-top:.4em}
.pcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--todo-soft);border-radius:14px;padding:1.6em 1.8em;box-shadow:var(--shadow);min-height:22em;display:flex;flex-direction:column}
.pcard.v-Pass{border-left-color:var(--pass)} .pcard.v-Fail{border-left-color:var(--fail)} .pcard.v-NA{border-left-color:var(--na)}
.pcard .u{font-size:.84em;color:var(--muted)}
.pcard h2{font-size:2.2em;letter-spacing:-.025em;margin:.15em 0 .3em;line-height:1.25}
.pcard .pcp{font-size:1.28em;line-height:1.72;color:var(--ink-2);white-space:pre-wrap;margin-top:.6em}
.pcard .nx{margin-top:auto;text-align:right;font-size:.84em;color:var(--muted);cursor:pointer;padding-top:1em;border-top:1px dashed var(--line)}
.pside{display:flex;flex-direction:column;gap:.8em}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1em;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.5em}
.fvbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.fvb{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:.6em 0 .4em;font-size:1.05em;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center}
.fvb small{font-family:var(--mono);font-size:.66em;font-weight:400;margin-top:.15em}
.fvb[aria-pressed="true"].Pass{background:var(--pass-soft);border-color:var(--pass);color:var(--pass)}
.fvb[aria-pressed="true"].Fail{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.fvb[aria-pressed="true"].NA{background:var(--na-soft);border-color:var(--na);color:var(--na)}
.plist .h{font-size:.72em;font-weight:700;color:var(--muted);margin-bottom:.3em}
.plist a{display:flex;gap:.6em;align-items:center;padding:.35em .5em;border-radius:6px;font-size:.84em;cursor:pointer;color:var(--ink-2)}
.plist a:hover{background:var(--surface-2)}
.plist a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.plist a .o{font-family:var(--mono);font-size:.84em;color:var(--muted)}
.plist a .st{margin-left:auto;width:.7em;height:.7em;border-radius:50%;background:var(--todo-soft);flex:0 0 auto}
.plist a .st.Pass{background:var(--pass)} .plist a .st.Fail{background:var(--fail)} .plist a .st.NA{background:var(--na)}
.pres-bot{display:flex;align-items:center;gap:.8em;margin-top:1em}
.pres-bot .segbar{flex:1}

/* ---- 백업 창 ---- */
.dlg{position:fixed;inset:0;z-index:85;background:rgba(12,17,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto}
.dlg-in{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:46em;padding:1.1em 1.3em 1.2em}
.dlg-in h2{margin:0 0 .2em;font-size:1.1em;display:flex;align-items:center;gap:.6em}
.dlg-in h2 .sp{flex:1}
.dlg-in .lead{color:var(--muted);font-size:.8em;margin:0 0 .6em}
.bk-sec{border-top:1px solid var(--line-soft);padding:.8em 0 .2em}
.bk-sec h3{margin:0 0 .4em;font-size:.9em;display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.bk-sec h3 .s{font-weight:400;color:var(--muted);font-size:.86em}
.bk-row{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.bk-list{margin-top:.5em;border:1px solid var(--line-soft);border-radius:var(--radius);max-height:18em;overflow:auto}
.bk-item{display:flex;gap:.6em;align-items:center;padding:.45em .7em;border-bottom:1px solid var(--line-soft);font-size:.82em}
.bk-item:last-child{border-bottom:0}
.bk-item .d{font-family:var(--mono);min-width:9.5em}
.bk-item .w{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-empty{padding:.7em;color:var(--muted);font-size:.8em}
.chip.warn{background:var(--na-soft);color:var(--na);border-color:var(--na);cursor:pointer;font-weight:700}

/* ---- 토스트 (§7.9) ---- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:99px;padding:.55em 1.2em;font-size:.84em;z-index:90;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* ---- 입장 화면 ---- */
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#gate .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.8em 1.6em;width:100%;max-width:26em;box-shadow:var(--shadow)}
#gate h2{margin:0 0 .2em;font-size:1.1em} #gate p{margin:0 0 1.1em;color:var(--muted);font-size:.84em}
#gate label{display:block;font-size:.78em;color:var(--muted);margin:.7em 0 .25em}
#gate .err{color:var(--fail);font-size:.8em;min-height:1.2em;margin-top:.5em}
#gate .row{display:flex;align-items:center;gap:.4em;font-size:.8em;color:var(--muted);margin-top:.7em}
#gate .btn{width:100%;margin-top:1em;padding:.7em;font-size:.9em}

/* ---- 기록 모드 진입 (키패드) ---- */
#btnRec.on{background:var(--pass-soft);border-color:var(--pass);color:var(--pass);font-weight:700}
#rec{position:fixed;inset:0;z-index:95;background:rgba(12,17,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;overflow:auto}
#rec .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:21em;padding:1.3em 1.3em 1.1em;text-align:center}
#rec .box.wide{max-width:30em;text-align:left}
#rec h2{margin:0 0 .15em;font-size:1.05em;display:flex;align-items:center;gap:.5em;justify-content:center}
#rec .box.wide h2{justify-content:flex-start}
#rec h2 .x{margin-left:auto;border:0;background:none;font-size:1.2em;color:var(--muted);cursor:pointer;line-height:1}
#rec p{margin:0 0 .5em;color:var(--muted);font-size:.8em}
#rec label{display:block;font-size:.76em;color:var(--muted);margin:.7em 0 .25em;text-align:left}
#rec .err{color:var(--fail);font-size:.8em;min-height:1.3em;margin-top:.3em}
#rec .ok{color:var(--pass)}
#rec .two{display:grid;grid-template-columns:1fr 1fr;gap:.7em}
#rec .acts{display:flex;gap:.5em;margin-top:.9em;align-items:center;flex-wrap:wrap}
#rec .link{border:0;background:none;color:var(--muted);font-size:.74em;cursor:pointer;text-decoration:underline;margin-top:.6em}
#rec .row{display:flex;align-items:center;justify-content:center;gap:.4em;font-size:.78em;color:var(--muted);margin-top:.7em}
.pin{display:flex;justify-content:center;gap:.9em;margin:.9em 0 .2em}
.pin i{width:.95em;height:.95em;border-radius:50%;border:2px solid var(--line);background:var(--surface);transition:background .12s,border-color .12s}
.pin i.on{background:var(--accent);border-color:var(--accent)}
.pin.bad{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;margin-top:.5em}
.keys button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:.7em 0;font-size:1.2em;font-weight:700;font-family:var(--mono);cursor:pointer;color:var(--ink)}
.keys button:hover{border-color:var(--accent);color:var(--accent)}
.keys button:active{background:var(--accent-soft)}
.keys button.fn{font-size:.82em;font-family:inherit;color:var(--muted)}
.keys button:disabled{opacity:.4;cursor:default}

/* ---- 반응형 (§6) ---- */
@media (max-width:1080px){ .body2{grid-template-columns:1fr} .rail{display:none} }
@media (max-width:1000px){ .pres-grid{grid-template-columns:1fr} }
@media (max-width:900px){ .step{grid-template-columns:44px 1fr} .step .side{grid-column:1/-1;border-left:0;border-top:1px solid var(--line-soft)} .shead .r2{grid-template-columns:1fr} }
@media (max-width:600px){ .top-in,.wrap,.scn{padding-left:16px;padding-right:16px} .grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }
@media print{ .top,.shead .r3,.rail,.map-tools{display:none!important} .body2{grid-template-columns:1fr} .map-scroll{max-height:none;overflow:visible} body{background:#fff} }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <div class="brand" id="goHome" role="link" tabindex="0" aria-label="홈으로"><span class="logo">G-ERP</span><b>통합테스트 4차 (10.12) 진행판</b><span class="chip acc">v3</span></div>
    <span class="sync" id="sync" aria-live="polite"></span>
    <span class="sp"></span>
    <div class="grp">
      <input type="date" class="fld date mono" id="runDate" aria-label="TEST 수행일">
      <input type="text" class="fld tester" id="tester" placeholder="수행자 (예: 정재우)" aria-label="TEST 수행자" maxlength="20">
      <button class="btn" id="fsDn" aria-label="글자 작게">A−</button><button class="btn" id="fsUp" aria-label="글자 크게">A＋</button>
      <button class="btn" id="btnRec" hidden title="기록자 전용 — 4자리 비밀번호로 결과·메모 입력">✎ 기록 모드</button>
      <button class="btn" id="btnPres">발표 모드</button>
      <button class="btn primary" id="btnXlsx">엑셀 내보내기</button>
      <button class="btn" id="btnBk" title="PC로 내려받기 · GitHub 스냅샷 · 복원">백업</button>
      <span class="chip warn" id="bkWarn" hidden title="마지막으로 내려받은 뒤 바뀐 내용이 있습니다">PC 백업 권장</span>
      <details class="menu" id="menu"><summary class="btn" aria-label="더보기">⋯</summary>
        <div class="pop">
          <div class="who" id="who"></div>
          <button data-act="refresh">최신 상태 불러오기</button>
          <button data-act="theme">라이트 / 다크 전환</button>
          <button data-act="backup">백업 · 복원 창 열기</button>
          <button data-act="import">백업 파일에서 복원</button>
          <button data-act="logout" data-gh>기록 모드 종료</button>
        </div></details>
      <input type="file" id="fileImport" accept=".json" hidden>
    </div>
  </div>
</header>
<main id="app"></main>
<div id="pres" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>

/* ================= 시나리오 모델 ================= */
const SC = [];

/* ================= 상태 (key-value) ================= */
// 키: res:<act>=Pass|Fail|NA · in:/out:/fix:/run:<act> · <act>=Activity 메모 · <scn>::secN / ::overview / ::map = 단락 메모
let KV = {}, META = {}, pending = {};

/* ================= 저장소 (로컬 / GitHub) ================= */
const GH = Object.assign({}, window.GH);
if(!GH.owner && /\.github\.io$/i.test(location.hostname)){ GH.owner = location.hostname.split('.')[0]; GH.repo = location.pathname.split('/').filter(Boolean)[0] || (GH.owner+'.github.io'); }
const GH_OK = !!(GH.owner && GH.repo);   // 비밀번호 없음: github.io 주소면 GitHub 저장 사용
const RO = GH_OK && !AUTH.token;
function setSync(cls, t){ const s=$('#sync'); s.className='sync '+cls; s.textContent=t; }
const u8b64 = u8 => { let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); };

  if(!r.ok){ let m=''; try{ m=(await r.json()).message; }catch(e){} throw new GhErr(r.status,m); }
  return r.status===204? null : r.json();
}

async function ensureBranch(){ if(branchReady) return;

  if(AUTH.token){ let j; try{ j=await gh('GET',`/contents/${GH.path}?ref=${encodeURIComponent(GH.branch)}&t=${Date.now()}`); }

  const r = await fetch(`${GH.raw}/${GH.owner}/${GH.repo}/${GH.branch}/${GH.path}?t=${Date.now()}`, {cache:'no-store'});

function errText(e){ if(!e||!e.status) return '연결 실패 · 재시도 예정'; if(e.status===401) return '토큰 오류 (만료/오타)';

function renderRail(s){
  const r=$('#rail'); if(!r) return;
  r.innerHTML = `<div class="rh">단위업무</div>`+s.sections.map((u,ui)=>{ const st=stats(u.acts);

  $$('[data-gou]', r).forEach(a=>a.onclick=e=>{ e.preventDefault(); jumpUnit(+a.dataset.gou); });
  if(window.IntersectionObserver){ const io=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ $$('a',r).forEach(x=>x.setAttribute('aria-current', x.dataset.gou===en.target.dataset.u)); } }); }, {rootMargin:'-170px 0px -65% 0px'}); $$('.unit').forEach(u=>io.observe(u)); }
}
function jumpUnit(ui){ const el=$('#u-'+ui); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
function wireScript(s){
  const units=$('#units');
  units.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return; const step=b.closest('.step');
    if(b.dataset.v && step){ setVerdict(s, step.dataset.k, b.dataset.v); return; }
    if(b.hasAttribute('data-more')){ const cp=b.previousElementSibling; cp.classList.toggle('clamp'); b.textContent = cp.classList.contains('clamp')?'전체 보기':'접기'; return; }
    if(b.dataset.open && step){ const box=$('[data-'+b.dataset.open+']', step); box.hidden=!box.hidden; if(b.dataset.open==='fix') b.remove(); else b.textContent = box.hidden?'+ 메모':'메모 접기'; if(!box.hidden) $('textarea',box).focus(); return; }
    if(b.dataset.unlock){ ls.set('unlock_'+b.dataset.unlock,'1'); const a=s.acts.find(x=>x._k===step.dataset.k); step.outerHTML=stepHtml(s,a); return; }
  });
  const f=$('#filters'); if(f){
    $$('[data-mod]',f).forEach(b=>b.onclick=()=>{ const m=b.dataset.mod; const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); on?VIEW.filt.mods.add(m):VIEW.filt.mods.delete(m); applyFilter(); });
    $$('[data-f]',f).forEach(b=>b.onclick=()=>{ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); VIEW.filt[b.dataset.f]=on; applyFilter(); });
    $('#q').oninput=e=>{ VIEW.filt.q=e.target.value.trim().toLowerCase(); applyFilter(); };
    applyFilter();
  }
}
function applyFilter(){
  const F=VIEW.filt, act=F.mods.size||F.todo||F.fail||F.q; let hit=0, tot=0;
  $$('.step').forEach(st=>{ tot++; const v=val('res:'+st.dataset.k);
    const ok = (!F.mods.size||F.mods.has(st.dataset.mod)) && (!F.todo||!v) && (!F.fail||v==='Fail') && (!F.q||st.dataset.text.includes(F.q)||st.textContent.toLowerCase().includes(F.q));
    st.hidden=!ok; if(ok) hit++; });
  $$('.unit').forEach(u=>u.classList.toggle('hide', !!act && !$$('.step',u).some(x=>!x.hidden)));
  const h=$('#hit'); if(h) h.textContent = act? `${hit} / ${tot}` : `${tot}건`;
}
function setVerdict(s, k, v){
  const a=s.acts.find(x=>x._k===k); if(!a) return;
  const nv = verdict(a)===v ? '' : v;           // 같은 버튼 다시 누르면 해제
  if(!put('res:'+k, nv, `${s.id} › ${a.aid} ${a.name}`)) return;
  put('run:'+k, nv? ($('#runDate').value||today())+'|'+($('#tester').value.trim()||myName()) : '', `${s.id} › ${a.aid} 수행일·수행자`);
  paintStep(k); refreshCounts(s);
  if(nv==='Fail'){ const st=$('#s-'+CSS.escape(k)); if(st){ const fx=$('[data-fix]',st); fx.hidden=false; const ob=$('[data-open="fix"]',st); if(ob) ob.remove(); setTimeout(()=>$('textarea',fx).focus(),30); } }
  toast(nv? `${a.aid} ${VLABEL[nv]}` : `${a.aid} 판정 해제`);
}
function paintStep(k){
  const st=document.getElementById('s-'+k); if(st){ const v=val('res:'+k);
    st.classList.remove('v-Pass','v-Fail','v-NA'); if(v) st.classList.add('v-'+v);
    $$('.vb',st).forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===v));
    const r=val('run:'+k).split('|'); const rd=$('[data-run]',st); if(rd) rd.textContent = r[0]? r[0]+' · '+(r[1]||'') : ''; }
  $$(`.mbox[data-k="${CSS.escape(k)}"]`).forEach(paintBox);
}
function refreshCounts(s){
  s = s || (VIEW.page==='scn' && scById(VIEW.scn)); if(!s) return;
  const st=stats(s.acts); const hc=$('#hdrCnt'); if(hc) hc.innerHTML=cnts(st); const hb=$('#hdrBar'); if(hb) hb.innerHTML=segbar(st);
  s.sections.forEach((u,ui)=>{ const us=stats(u.acts); const c=$(`[data-ucnt="${ui}"]`); if(c) c.textContent=`${us.done} / ${us.t} 완료`; const b=$(`[data-ubar="${ui}"]`); if(b) b.innerHTML=segbar(us);
    const ra=$(`#rail [data-gou="${ui}"]`); if(ra && u.acts.length){ ra.querySelector('.c').textContent=us.done+'/'+us.t; ra.querySelector('.segbar').outerHTML=segbar(us,'sm'); }
    $$(`[data-msec="${ui}"]`).forEach(mh=>mh.textContent=`${us.done}/${us.t} · P${us.p} F${us.f} NA${us.n}`); });
  if(!$('#pres').hidden) presPaint();
}

document.addEventListener('input', e=>{

/* 흐름: 앞 단위업무와의 관계 (seq=순차, par=병렬 트랙, next=다음 단계) · 키 = 단위업무 index · KV 'flow:<시나리오>' 에 저장(공유) */

function buildMap(s){
  const cv=$('#mapCanvas'), sc=$('#mapScroll'); const laneOf=a=>normSys(a.system);
  const pg=mapPages(s), cur=curPage(s), pi=pg.indexOf(cur);
  const show = MAP_ALL ? pg : [cur];
  $('#pgPrev').disabled = MAP_ALL || pi<=0; $('#pgNext').disabled = MAP_ALL || pi>=pg.length-1;
  $('#pgNo').textContent = MAP_ALL ? `전체 ${pg.length}` : `${pi+1} / ${pg.length}`;

  $('#mapAllBtn').setAttribute('aria-pressed', MAP_ALL);
  $('#mapAllBtn').onclick=()=>{ MAP_ALL=!MAP_ALL; ls.set('mapall', MAP_ALL?'1':null); mapZoom=null; buildMap(s); };
  $('#mapWrapBtn').setAttribute('aria-pressed', MAP_WRAP);
  $('#mapWrapBtn').onclick=()=>{ MAP_WRAP=!MAP_WRAP; ls.set('mapwrap', MAP_WRAP?null:'0'); mapZoom=null; buildMap(s); };
  $('#mapFlowBtn').onclick=()=>{ const fe=$('#flowEdit'); fe.hidden=!fe.hidden; if(!fe.hidden && !MAP_ALL){ MAP_ALL=true; ls.set('mapall','1'); mapZoom=null; buildMap(s); } drawFlow(s); };
  $('#pgMemo').innerHTML = MAP_ALL ? '' : memoBox(s.id+'::sec'+cur, '단락 메모 · '+s.sections[cur].title);

  /* 1차: 단계 → 트랙 → 줄 단위로 가로 배치 */
  const availRaw = sc.clientWidth || ((app.clientWidth||1280) - 60);
  const maxX = MAP_WRAP ? Math.max(M.LABEL+10+M.COL*4+M.PAD*2, availRaw-10) : Infinity;
  cv.dataset.bw = availRaw;
  const stages = MAP_ALL ? flowStruct(s, show) : [{tracks:[[cur]]}];
  const multi = stages.length>1 || stages.some(x=>x.tracks.length>1);
  const RG=38, SH=34; let W=0;
  const rows=[], boxes=[], chunks=[], stageMarks=[], trackItems=[], trackBars=[], seq=[];
  stages.forEach((stg,gi)=>{
    if(multi){ const m={gi, n:stg.tracks.length}; stageMarks.push(m); seq.push({stage:m}); }
    stg.tracks.forEach((trk,ti)=>{
      const items=[]; trackItems.push(items);
      const tb = stg.tracks.length>1 ? {rows:[]} : null; if(tb) trackBars.push(tb);
      let row=null;
      const newRow = cont=>{ row={x:M.LABEL+10, n:0, cont, tag: stg.tracks.length>1? '트랙 '+'ABCDEFGHIJ'[ti] : '', items:[]}; rows.push(row); seq.push({row}); if(tb) tb.rows.push(row); };
      newRow(false);
      trk.forEach(ui=>{
        const u=s.sections[ui], n=u.acts.length;
        const need = M.PAD*2 + n*M.COL - (M.COL-M.BOXW);
        if(row.n && row.x+need > maxX && need <= maxX-(M.LABEL+10)) newRow(true);   // 작은 단위업무는 쪼개지 않고 다음 줄로
        let ch=null;
        const open = cont=>{ ch={u, ui, row, x0:row.x, items:[], cont}; chunks.push(ch); row.x+=M.PAD; };
        const close = ()=>{ row.x += M.PAD-(M.COL-M.BOXW); ch.x1=row.x; W=Math.max(W,row.x); row.x+=8; };
        for(let i=0;i<n;i++){
          if(!ch){ if(row.n && row.x+M.PAD*2+M.BOXW > maxX) newRow(true); open(i>0); }
          else if(row.x+M.BOXW+M.PAD > maxX){ close(); newRow(true); open(true); }
          const a=u.acts[i], b={a, ui, row, x:row.x, lane:laneOf(a)};
          ch.items.push(b); items.push(b); boxes.push(b); row.items.push(b); row.x+=M.COL; row.n++;

    r.lanes = LANE_ORDER.filter(l=>used.has(l)).concat([...used].filter(l=>!LANE_ORDER.includes(l)).sort());

  /* 연결선: 같은 트랙 안에서만 (같은 단위업무 = 실선, 단위업무 간 = 점선, 줄바뀜 = 꺾은선) */
  const ctr=b=>({l:b.x, r:b.x+M.BOXW, cy:b.y+M.BOXH/2});
  const link=(a,b,c)=>{ const A=ctr(a),B=ctr(b); if(Math.abs(A.cy-B.cy)<1) return `<path class="${c}" d="M${A.r+2},${A.cy} L${B.l-4},${B.cy}" marker-end="url(#ah)"/>`;
    const mx=Math.round((A.r+B.l)/2), d=B.cy>A.cy?8:-8; return `<path class="${c}" d="M${A.r+2},${A.cy} L${mx-8},${A.cy} Q${mx},${A.cy} ${mx},${A.cy+d} L${mx},${B.cy-d} Q${mx},${B.cy} ${mx+8},${B.cy} L${B.l-4},${B.cy}" marker-end="url(#ah)"/>`; };
  const wrapLink=(a,b,c)=>{ const A=ctr(a),B=ctr(b), gy=a.row.y+a.row.h+RG/2, xr=A.r+11, xl=B.l-13;
    return `<path class="${c} w" d="M${A.r+2},${A.cy} L${xr},${A.cy} L${xr},${gy} L${xl},${gy} L${xl},${B.cy} L${B.l-4},${B.cy}" marker-end="url(#ah)"/>`; };

    + trackBars.map(t=>`<div class="mtrk" style="top:${t.y0}px;height:${t.y1-t.y0}px"></div>`).join('')
    + chunks.map(g=>{ const st=stats(g.u.acts); return `<div class="msec" style="left:${g.x0}px;top:${g.row.y}px;width:${g.x1-g.x0}px;height:${g.row.h}px"><div class="msec-h" data-gou="${g.ui}" title="${esc(g.u.title)}">${esc(g.u.title)}${g.cont?' <span class="muted">(계속)</span>':''}<span class="c" data-msec="${g.ui}">${st.done}/${st.t} · P${st.p} F${st.f} NA${st.n}</span></div></div>`; }).join('')
    + `<svg class="msvg" width="${W}" height="${H}"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>${paths}</svg>`
    + boxes.map(b=>{ const a=b.a; return `<div class="mbox ${modCls(a.module)}" data-k="${esc(a._k)}" tabindex="0" style="left:${b.x}px;top:${b.y}px;width:${M.BOXW}px;height:${M.BOXH}px" title="${esc([a.aid,a.name,'System: '+(a.system||'-'),'T-Code: '+(a.tcode||'-'),a.check?'점검: '+a.check:''].filter(Boolean).join('\n'))}">
        <span class="mt">${esc(modName(a.module))}</span><span class="n"><span class="s">${esc(a.seq)}</span>${esc(a.name)}</span><span class="tcd">${esc(String(a.tcode||'').replace(/\n/g,' / '))||'&nbsp;'}</span><span class="v"></span></div>`; }).join('');
  $$('.mbox',cv).forEach(bx=>{ paintBox(bx); bx.onclick=()=>gotoAct(bx.dataset.k); bx.onkeydown=e=>{ if(e.key==='Enter') gotoAct(bx.dataset.k); }; });

  $$('.map-tools [data-z]').forEach(b=>b.onclick=()=>{ const v=b.dataset.z;
    if(v==='full'){ sc.classList.toggle('full'); b.textContent=sc.classList.contains('full')?'전체화면 닫기':'전체화면'; mapZoom=null; requestAnimationFrame(()=>buildMap(s)); return; }

      <div class="bk-row"><button class="btn primary" id="bkDl">지금 내려받기 (JSON)</button><button class="btn" id="bkFile" ${RO?'disabled':''}>백업 파일에서 복원</button>
      <span class="muted" style="font-size:.76em">3시간 넘게 내려받지 않고 변경이 쌓이면 상단에 ‘PC 백업 권장’이 표시됩니다.</span></div></div>
    ${GH_OK? `<div class="bk-sec"><h3>② GitHub 스냅샷 <span class="s">저장소 ${esc(GH.branch)} 브랜치 / ${SNAP_DIR}/ · 암호화 · 팀 공용</span></h3>
      <div class="bk-row"><button class="btn primary" id="bkSnap" ${RO?'disabled title="토큰 등록 후 사용"':''}>지금 스냅샷 저장</button>
      <span class="muted" style="font-size:.76em">매일 그날 첫 저장 때, 저장 직전 상태가 자동 스냅샷으로 남습니다.</span></div>
      <div class="bk-list" id="bkGh"><div class="bk-empty">목록 불러오는 중…</div></div></div>` : ''}
    <div class="bk-sec"><h3>${GH_OK?'③':'②'} 이 PC 스냅샷 <span class="s">이 브라우저에만 보관 · 최근 10개 · 하루 1회 자동</span></h3>
      <div class="bk-row"><button class="btn" id="bkLocal">지금 이 PC에 스냅샷</button></div>
      <div class="bk-list">${loc.length? loc.map((x,i)=>`<div class="bk-item"><span class="d">${esc(fmtTime(x.at))}</span><span class="chip">${esc(KIND_L[x.kind]||x.kind)}</span><span class="w">${esc(x.label||'')} · ${Object.keys(x.kv||{}).length}건 · ${esc(x.by||'')}</span>
        <button class="btn" data-lr="${i}" ${RO?'disabled':''}>복원</button><button class="btn" data-ld="${i}">내려받기</button></div>`).join('') : '<div class="bk-empty">아직 없음</div>'}</div></div>`;
  $('#bkX').onclick=bkClose; $('#bkDl').onclick=downloadBackup; $('#bkFile').onclick=()=>$('#fileImport').click();
  $('#bkLocal').onclick=()=>{ localSnap('manual','수동'); toast('이 PC에 스냅샷을 남겼습니다'); renderBk(); };
  $$('[data-lr]',box).forEach(b=>b.onclick=()=>{ const x=localSnaps()[+b.dataset.lr]; restoreKv(x.kv, `이 PC 스냅샷 ${fmtTime(x.at)}`); });
  $$('[data-ld]',box).forEach(b=>b.onclick=()=>{ const x=localSnaps()[+b.dataset.ld]; dlJson('통테4차_스냅샷_'+x.id+'.json', backupObj(x.kv, {}, '이 PC 스냅샷 '+x.at)); });
  if(!GH_OK) return;
  if($('#bkSnap')) $('#bkSnap').onclick=async e=>{ e.target.disabled=true; try{ await flush(); const n=await ghSnap('manual'); toast(n?'GitHub에 스냅샷을 저장했습니다':'이미 같은 시각 스냅샷이 있습니다'); }catch(err){ toast('스냅샷 실패: '+errText(err)); } renderBk(); };
  const gl=$('#bkGh');
  try{ const list=await ghList(); if(!gl.isConnected) return;
    gl.innerHTML = list.length? list.map(f=>`<div class="bk-item"><span class="d">${esc(snapLabel(f.name))}</span><span class="chip">${esc(KIND_L[kindOf(f.name)]||'')}</span><span class="w">${esc(f.name)} · ${Math.max(1,Math.round(f.size/1024))}KB</span>
      ${kindOf(f.name)==='legacy'?'<span class="muted" style="font-size:.9em">이전 비밀번호 필요</span>':`<button class="btn" data-gr="${esc(f.path)}" ${RO?'disabled':''}>복원</button><button class="btn" data-gd="${esc(f.path)}">내려받기</button>`}</div>`).join('') : '<div class="bk-empty">아직 없음 — 첫 저장 또는 ‘지금 스냅샷 저장’ 후 생깁니다</div>';
    $$('[data-gr]',gl).forEach(b=>b.onclick=async()=>{ try{ const st=await ghReadSnap(b.dataset.gr); restoreKv(itemsToKv(st.items), 'GitHub 스냅샷 '+snapLabel(b.dataset.gr)); }catch(err){ toast('스냅샷 읽기 실패: '+errText(err)); } });
    $$('[data-gd]',gl).forEach(b=>b.onclick=async()=>{ try{ const st=await ghReadSnap(b.dataset.gd); dlJson('통테4차_'+b.dataset.gd.split('/').pop(), backupObj(itemsToKv(st.items), {}, 'GitHub 스냅샷 '+b.dataset.gd)); }catch(err){ toast('스냅샷 읽기 실패: '+errText(err)); } });
  }catch(err){ gl.innerHTML = `<div class="bk-empty">목록을 불러오지 못했습니다: ${esc(errText(err))}</div>`; }
}
$('#btnBk').onclick=bkOpen; $('#bkWarn').onclick=downloadBackup;
$('#bk').addEventListener('click', e=>{ if(e.target.id==='bk') bkClose(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#bk').hidden){ e.stopImmediatePropagation(); bkClose(); } }, true);
setInterval(bkWarn, 5*60e3);

/* ================= 상단바 ================= */
function setTopH(){ const r=document.documentElement.style, t=$('#top').offsetHeight, sh=$('#shead'); r.setProperty('--toph', t+'px');
  const h = t + (sh? sh.offsetHeight : 0); r.setProperty('--railtop', (h+12)+'px'); r.setProperty('--jump', (h+12)+'px'); }
window.addEventListener('resize', setTopH);
const fsSet = px=>{ px=Math.max(12,Math.min(26,px)); document.documentElement.style.setProperty('--fs', px+'px'); ls.set('fs',px); setTopH(); if(VIEW.sub==='map'&&VIEW.page==='scn') zoom(mapZoom||'auto'); };
fsSet(+(ls.get('fs')||16));
$('#fsUp').onclick=()=>fsSet(+(ls.get('fs')||16)+1); $('#fsDn').onclick=()=>fsSet(+(ls.get('fs')||16)-1);
$('#runDate').value = ls.get('date') || today(); $('#runDate').onchange=e=>ls.set('date', e.target.value);
$('#tester').value = ls.get('tester') || AUTH.name || ''; $('#tester').oninput=e=>ls.set('tester', e.target.value);
$('#btnPres').onclick=presOpen; $('#btnXlsx').onclick=exportXlsx;
$('#goHome').onclick=()=>go('home'); $('#goHome').onkeydown=e=>{ if(e.key==='Enter') go('home'); };
$('#who').textContent = GH_OK ? (RO? '보기 전용 · 기록은 기록자만' : `기록자 ${AUTH.name||''} · 기록 모드`) : '로컬 파일 · 이 PC 저장';
$$('[data-gh]').forEach(b=>b.hidden=!AUTH.token);
const th=ls.get('theme'); if(th) document.documentElement.dataset.theme=th;
$('#menu').addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(!b) return; $('#menu').open=false; const a=b.dataset.act;
  if(a==='refresh'){ flush(); pull(true); toast('최신 상태를 불러옵니다'); }
  if(a==='theme'){ const r=document.documentElement; const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme=cur==='dark'?'light':'dark'; ls.set('theme',r.dataset.theme); }
  if(a==='backup'){ bkOpen(); }
  if(a==='import'){ if(RO){ toast('보기 전용에서는 불러올 수 없습니다'); return; } $('#fileImport').click(); }
  if(a==='logout'){ window.__rec && window.__rec.exit(); }
});
document.addEventListener('click', e=>{ if(!e.target.closest('#menu')) $('#menu').open=false; });
$('#fileImport').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ let src; try{ src=parseBackupFile(JSON.parse(r.result)); }catch(err){ toast('백업 파일을 읽지 못했습니다'); return; }
  restoreKv(src, '백업 파일 '+f.name); }; r.readAsText(f); e.target.value=''; };
window.addEventListener('beforeunload', e=>{ if(GH_OK && Object.keys(pending).length){ flush(); e.preventDefault(); e.returnValue=''; } });

/* ================= 시작 ================= */
const last = ls.get('last'); if(last && scById(last)){ VIEW.page='scn'; VIEW.scn=last; }
localSnapDaily(); render(); setTopH(); bkWarn();
if(Object.keys(pending).length) flushSoon(300);
pull(true).then(()=>{ render(); if(GH_OK){ setInterval(()=>{ if(!document.hidden){ flush(); pull(false); } }, RO?60000:30000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull(false); }); if(AUTH.token) ensureBranch().catch(e=>setSync('err',errText(e))); } });
};
</script>
<script>
/* 부트 — 보는 사람: 바로 열람(보기 전용) / 기록자: ✎ 기록 모드 → 4자리 키패드 → 입력 가능
   토큰은 파일에 넣지 않고, 기록자 PC 브라우저에만 4자리 비밀번호로 암호화해 보관 */
(function(){
  'use strict';
  const LS='gerp_it4_v2';
  const get=k=>{ try{ return localStorage.getItem(LS+'_'+k); }catch(e){ return null; } };
  const set=(k,v)=>{ try{ v==null? localStorage.removeItem(LS+'_'+k) : localStorage.setItem(LS+'_'+k,v); }catch(e){} };
  const sget=k=>{ try{ return sessionStorage.getItem(LS+'_'+k); }catch(e){ return null; } };
  const sset=(k,v)=>{ try{ v==null? sessionStorage.removeItem(LS+'_'+k) : sessionStorage.setItem(LS+'_'+k,v); }catch(e){} };
  window.__gate={get,set};
  const $id=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const D=JSON.parse($id('src-data').textContent);
  const G=window.GH||{}, onGh=/\.github\.io$/i.test(location.hostname) || !!(G.owner && G.repo);
  const owner = G.owner || location.hostname.split('.')[0], repo = G.repo || location.pathname.split('/').filter(Boolean)[0] || (owner+'.github.io');
  let REC=null; try{ REC=JSON.parse(get('rec')||'null'); }catch(e){}
  const tok = onGh ? (sget('rtok') || get('rtok') || '') : '';
  window.startApp(D, {name: tok&&REC? REC.name : (get('name')||''), key:null, token: tok});

  const btn=$id('btnRec'), box=$id('rec');
  if(!onGh){ btn.hidden=true; return; }      // 로컬 파일: 이 PC에 바로 기록
  btn.hidden=false;
  const exit=()=>{ if(!confirm('기록 모드를 종료할까요? (보기 전용으로 전환)')) return; sset('rtok',null); set('rtok',null); location.reload(); };
  window.__rec={exit};
  if(tok){ btn.classList.add('on'); btn.textContent='✎ 기록 중 · '+(REC?REC.name:''); btn.title='누르면 기록 모드 종료'; btn.onclick=exit; return; }
  btn.onclick=()=> REC? keypad() : setup();

  /* ---- 암호화 도우미 ---- */
  const enc=new TextEncoder(), b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const u8b64=u=>{ let s=''; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); };
  async function keyOf(pin, salt, iter){ const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
  const close=()=>{ box.hidden=true; box.innerHTML=''; document.removeEventListener('keydown', onKey); };
  let onKey=()=>{};
  box.addEventListener('click', e=>{ if(e.target===box) close(); });
  function enterRec(t, keep){ sset('rtok', t); set('rtok', keep? t : null); location.reload(); }

  /* ---- 키패드 ---- */
  function keypad(){
    box.hidden=false;
    box.innerHTML = `<div class="box"><h2>✎ 기록 모드<button class="x" data-x aria-label="닫기">×</button></h2>
      <p>${esc(REC.name)} · 비밀번호 4자리</p>
      <div class="pin" id="rPin"><i></i><i></i><i></i><i></i></div><div class="err" id="rErr"></div>
      <div class="keys" id="rKeys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="fn" data-k="C">전체 지움</button><button data-k="0">0</button><button class="fn" data-k="B" aria-label="한 자리 지움">⌫</button></div>
      <div class="row"><input type="checkbox" id="rKeep" ${get('rkeep')==='1'?'checked':''}><label for="rKeep" style="display:inline;margin:0">이 PC에서 기록 모드 유지</label></div>
      <button class="link" data-reset>토큰·비밀번호 다시 설정</button></div>`;
    let pin='', busy=false, fails=+(get('rfails')||0), until=+(get('runtil')||0);
    const pinEl=$id('rPin'), err=$id('rErr'), dots=()=>[...pinEl.children].forEach((d,i)=>d.classList.toggle('on',i<pin.length));
    const tick=()=>{ const left=Math.ceil((until-Date.now())/1000), ks=[...$id('rKeys')?.children||[]];
      if(left>0){ ks.forEach(b=>b.disabled=true); err.textContent=`잠시 후 다시 시도 (${left}초)`; setTimeout(tick,500); } else { ks.forEach(b=>b.disabled=false); if(/잠시 후/.test(err.textContent)) err.textContent=''; } };
    async function tryPin(){
      busy=true; err.textContent='';
      try{ const k=await keyOf(pin, b64(REC.salt), REC.iter);
        const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(REC.iv)},k,b64(REC.ct)));
        set('rfails',null); set('runtil',null); const keep=$id('rKeep').checked; set('rkeep', keep?'1':null); enterRec(t, keep);
      }catch(e){ busy=false; pin=''; dots(); fails++; set('rfails',fails); pinEl.classList.remove('bad'); void pinEl.offsetWidth; pinEl.classList.add('bad');
        if(fails>=5){ until=Date.now()+30000; set('runtil',until); tick(); } else err.textContent=`비밀번호가 올바르지 않습니다 (${fails}/5)`; }
    }
    const press=k=>{ if(busy||Date.now()<until) return; if(k==='C') pin=''; else if(k==='B') pin=pin.slice(0,-1); else if(/^\d$/.test(k)&&pin.length<4) pin+=k; dots(); if(pin.length===4) tryPin(); };
    $id('rKeys').onclick=e=>{ const b=e.target.closest('[data-k]'); if(b) press(b.dataset.k); };
    box.querySelector('[data-x]').onclick=close;
    box.querySelector('[data-reset]').onclick=()=>{ if(confirm('저장된 토큰·비밀번호를 지우고 다시 설정할까요?')){ set('rec',null); REC=null; setup(); } };
    document.removeEventListener('keydown', onKey);
    onKey=e=>{ if(e.target.tagName==='INPUT' && e.target.type!=='checkbox') return; if(/^\d$/.test(e.key)){ e.preventDefault(); press(e.key); } else if(e.key==='Backspace'){ e.preventDefault(); press('B'); } else if(e.key==='Escape'){ e.stopImmediatePropagation(); close(); } };
    document.addEventListener('keydown', onKey, true);
    if(Date.now()<until) tick();
  }

  /* ---- 최초 설정 (이 PC 1회) ---- */
  function setup(){
    box.hidden=false;
    box.innerHTML = `<div class="box wide"><h2>✎ 기록 모드 설정 (이 PC 1회)<button class="x" data-x aria-label="닫기">×</button></h2>
      <p>토큰은 파일에 들어가지 않고 이 PC 브라우저에만 4자리 비밀번호로 암호화해 보관합니다. 다음부터는 ✎ 기록 모드 → 4자리만 누르면 됩니다.</p>
      <label for="sName">기록자 이름</label><input class="fld" id="sName" maxlength="20" placeholder="예: 정재우" value="${esc(get('name')||'')}">
      <label for="sTok">GitHub 토큰 <span style="font-weight:400">(Fine-grained · 저장소 ${esc(owner)}/${esc(repo)} · Contents: Read and write)</span></label><input class="fld" id="sTok" type="password" autocomplete="off" placeholder="github_pat_…">
      <div class="two"><div><label for="sPin">비밀번호 4자리</label><input class="fld" id="sPin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></div>
        <div><label for="sPin2">비밀번호 확인</label><input class="fld" id="sPin2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></div></div>
      <div class="row" style="justify-content:flex-start"><input type="checkbox" id="sKeep"><label for="sKeep" style="display:inline;margin:0">이 PC에서 기록 모드 유지 (창을 닫아도 유지)</label></div>
      <div class="err" id="sErr"></div>
      <div class="acts"><button class="btn primary" id="sGo">확인 후 기록 시작</button><button class="btn" data-x>취소</button></div></div>`;
    box.querySelectorAll('[data-x]').forEach(b=>b.onclick=close);
    document.removeEventListener('keydown', onKey); onKey=e=>{ if(e.key==='Escape'){ e.stopImmediatePropagation(); close(); } }; document.addEventListener('keydown', onKey, true);
    $id('sName').focus();
    $id('sGo').onclick=async()=>{
      const name=$id('sName').value.trim(), t=$id('sTok').value.trim(), p1=$id('sPin').value, p2=$id('sPin2').value, err=$id('sErr');
      err.className='err';
      if(!name) return err.textContent='기록자 이름을 입력하세요';
      if(!t) return err.textContent='GitHub 토큰을 입력하세요';
      if(!/^\d{4}$/.test(p1)) return err.textContent='비밀번호는 숫자 4자리입니다';
      if(p1!==p2) return err.textContent='비밀번호 확인이 일치하지 않습니다';
      err.textContent='GitHub 연결 확인 중…';
      try{ const r=await fetch(`https://api.github.com/repos/${owner}/${repo}`,{headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t},cache:'no-store'});
        if(r.status===401) throw new Error('토큰이 올바르지 않습니다 (만료·오타)');
        if(r.status===404) throw new Error(`저장소 ${owner}/${repo} 에 접근할 수 없습니다 — 토큰의 저장소 선택 확인`);
        if(!r.ok) throw new Error('GitHub 오류 '+r.status);
        const j=await r.json(); if(j.permissions && !j.permissions.push) throw new Error('토큰에 쓰기 권한이 없습니다 (Contents: Read and write)');
      }catch(e){ err.textContent = e.message || '연결 실패 — 네트워크 확인'; return; }
      const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)), iter=200000;
      const k=await keyOf(p1, salt, iter);
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(t)));
      set('rec', JSON.stringify({name, salt:u8b64(salt), iv:u8b64(iv), ct:u8b64(ct), iter})); set('name', name);
      const keep=$id('sKeep').checked; set('rkeep', keep?'1':null); enterRec(t, keep);
    };
  }
})();
</script>
