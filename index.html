<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통테4차 시나리오 대시보드</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface2:#f8fafc; --line:#e2e8f0; --line2:#cbd5e1;
  --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --brand:#1e3a8a; --brand2:#2563eb; --brandSoft:#e8eefc;
  --pass:#15803d; --passSoft:#dcfce7; --fail:#b91c1c; --failSoft:#fee2e2; --na:#64748b; --naSoft:#f1f5f9;
  --warn:#b45309; --warnSoft:#fef3c7; --memo:#fffbeb; --memoLine:#fcd34d;
  --hl:#fde68a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1120; --surface:#111827; --surface2:#0f172a; --line:#1f2937; --line2:#334155;
    --ink:#e5e7eb; --ink2:#9ca3af; --ink3:#6b7280;
    --brand:#93c5fd; --brand2:#60a5fa; --brandSoft:#1e293b;
    --pass:#4ade80; --passSoft:#052e16; --fail:#f87171; --failSoft:#450a0a; --na:#9ca3af; --naSoft:#1f2937;
    --warn:#fbbf24; --warnSoft:#422006; --memo:#1c1917; --memoLine:#a16207; --hl:#854d0e;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#111827; --surface2:#0f172a; --line:#1f2937; --line2:#334155;
  --ink:#e5e7eb; --ink2:#9ca3af; --ink3:#6b7280;
  --brand:#93c5fd; --brand2:#60a5fa; --brandSoft:#1e293b;
  --pass:#4ade80; --passSoft:#052e16; --fail:#f87171; --failSoft:#450a0a; --na:#9ca3af; --naSoft:#1f2937;
  --warn:#fbbf24; --warnSoft:#422006; --memo:#1c1917; --memoLine:#a16207; --hl:#854d0e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.titlebar{display:flex;align-items:center;gap:16px;padding:14px 0 8px;flex-wrap:wrap}
.titlebar h1{font-size:18px;margin:0;letter-spacing:-.2px}
.titlebar .sub{color:var(--ink2);font-size:12.5px}
.titlebar .spacer{flex:1}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--brand2);color:var(--brand2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1120}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1120}}
.savestate{color:var(--brand2)}
td b{white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{border:0;background:none;padding:10px 14px 11px;cursor:pointer;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;font-size:13.5px}
nav.tabs button .tid{font-weight:700;margin-right:6px;color:var(--ink)}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
nav.tabs button.on .tid{color:var(--brand)}
main{padding:24px 20px 60px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:14px;margin:14px 0 8px}
.muted{color:var(--ink2)} .small{font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--ink2)} .kpi .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink3)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;font-size:13px}
th{background:var(--surface2);color:var(--ink2);font-weight:600;font-size:12px;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--brandSoft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-scroll{overflow-x:auto}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;background:var(--naSoft);color:var(--na);white-space:nowrap;border:1px solid transparent}
.chip.brand{background:var(--brandSoft);color:var(--brand)}
.chip.warn{background:var(--warnSoft);color:var(--warn)}
.chip.pass{background:var(--passSoft);color:var(--pass)}
.chip.fail{background:var(--failSoft);color:var(--fail)}
.chip.memo{background:var(--memo);color:var(--warn);border-color:var(--memoLine)}
.bar{height:8px;border-radius:99px;background:var(--naSoft);overflow:hidden;display:flex;min-width:80px}
.bar i{display:block;height:100%}
.bar .p{background:var(--pass)} .bar .f{background:var(--fail)}
.meta-grid{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13px;margin-bottom:12px}
.meta-grid dt{color:var(--ink2)} .meta-grid dd{margin:0}
.summary-box{background:var(--brandSoft);border-left:4px solid var(--brand);padding:10px 14px;border-radius:6px;margin:4px 0 12px}
/* tree */
.tree details{margin:2px 0}
.tree summary{cursor:pointer;padding:4px 0;list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";display:inline-block;width:16px;color:var(--ink3);transition:transform .15s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree .lv1>summary{font-weight:700}
.tree .lv2>summary{font-weight:600}
.tree .kids{padding-left:18px;border-left:1px dashed var(--line2);margin-left:6px}
.tree .leaf{padding:2px 0 2px 16px;position:relative}
.tree .leaf::before{content:attr(data-k);position:absolute;left:0;color:var(--brand2);font-size:11px;top:4px}
/* section accordion */
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--surface);overflow:hidden}
.sec>.sh{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:var(--surface2);flex-wrap:wrap}
.sec>.sh .caret{width:14px;color:var(--ink3);transition:transform .15s}
.sec.open>.sh .caret{transform:rotate(90deg)}
.sec>.sh .st{font-weight:700;flex:1;min-width:200px}
.sec>.sb{display:none;padding:10px 14px 14px}
.sec.open>.sb{display:block}
.sec.dim{opacity:.55}
.acts td.nm{font-weight:600}
.acts tr.act{cursor:pointer}
.acts tr.act:hover td{background:var(--brandSoft)}
.acts tr.act.open td{background:var(--brandSoft)}
.acts tr.det>td{background:var(--surface2);padding:12px 14px}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 18px;font-size:13px}
.det-grid .f .k{font-size:11.5px;color:var(--ink2)}
.det-grid .f .v{white-space:pre-wrap;word-break:break-word}
.det-grid .f.wide{grid-column:1/-1}
.empty{color:var(--ink3)}
select.res{border:1px solid var(--line2);border-radius:6px;padding:2px 4px;font-size:12px;background:var(--surface)}
select.res.pass{color:var(--pass);border-color:var(--pass)} select.res.fail{color:var(--fail);border-color:var(--fail)}
.memo{margin-top:12px;background:var(--memo);border:1px solid var(--memoLine);border-radius:8px;padding:8px 10px}
.memo label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--warn);margin-bottom:4px}
.memo label span{font-weight:400;color:var(--ink3)}
.memo textarea{width:100%;min-height:58px;border:0;background:transparent;resize:vertical;outline:none;font-size:13px;line-height:1.5}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search]{flex:1;min-width:200px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;background:var(--surface)}
.filters select{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;background:var(--surface)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{font-size:11px;padding:0 6px;border-radius:4px;background:var(--brandSoft);color:var(--brand)}
.dot.off{background:transparent;color:var(--ink3);text-decoration:line-through;opacity:.5}
.grp-row td{background:var(--surface2);font-weight:700;color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}.meta-grid{grid-template-columns:90px 1fr}}
.sysbars .r{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.sysbars .r .b{height:10px;background:var(--brand2);border-radius:3px}
.note li{margin:3px 0}
.e2e-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.subtabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .subtabs button.on{color:#0b1120}
.subtabs button .cnt{opacity:.7;margin-left:4px;font-size:11px}
.breadcrumb{font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.breadcrumb a{color:var(--brand2);cursor:pointer;text-decoration:none}
.userbox{display:flex;align-items:center;gap:6px;font-size:12.5px}
.sync{display:inline-flex;align-items:center;gap:5px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.sync.ok::before{background:var(--pass)} .sync.busy::before{background:var(--warn)} .sync.err::before{background:var(--fail)}
textarea[readonly]{cursor:default}
.mmeta{font-weight:400;color:var(--ink3);font-size:11.5px}
.mmeta.remote{color:var(--brand2);font-weight:700}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#gate .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
#gate h2{margin:0 0 4px;font-size:17px} #gate p{margin:0 0 18px;color:var(--ink2);font-size:13px}
#gate label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 4px}
#gate input[type=text],#gate input[type=password],#gate input[type=url]{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--surface)}
#gate .err{color:var(--fail);font-size:12.5px;min-height:18px;margin-top:8px}
#gate .row{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:10px}
#gate button{width:100%;margin-top:14px;padding:9px}
@media print{
  header.top{position:static} .tools,.filters,nav.tabs{display:none}
  .panel{display:block!important;page-break-after:always}
  .sec>.sb{display:block!important} .card,.sec{break-inside:avoid-page}
  body{background:#fff}
}
@media (max-width:600px){.wrap{padding:0 16px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="titlebar">
      <div>
        <h1>G.ERP 통합테스트 4차 (10.12) · 시나리오 대시보드</h1>
        <div class="sub"><span id="subline"></span> · <span class="sync" id="syncstate"></span> <span class="savestate" id="savestate"></span></div>
      </div>
      <div class="spacer"></div>
      <div class="tools">
        <span class="userbox"><span class="muted">사용자</span> <b id="userName"></b> <span class="chip" id="modeChip"></span> <button class="btn" id="btnToken" title="GitHub 토큰 등록/해제 (작성 권한)">토큰</button> <button class="btn" id="btnUser" title="로그아웃 후 다시 입장">로그아웃</button></span>
        <button class="btn" id="btnExpand">전체 펼치기</button>
        <button class="btn" id="btnCollapse">전체 접기</button>
        <button class="btn" id="btnCsv" title="메모·결과를 CSV로 다운로드 (엑셀에서 열기)">메모 CSV</button>
        <button class="btn" id="btnJson" title="메모·결과 백업 파일(JSON) 저장">백업</button>
        <button class="btn" id="btnImport" title="백업 JSON 불러오기">불러오기</button>
        <button class="btn" id="btnSync" title="GitHub에서 최신 메모·결과 다시 불러오기">새로고침</button>
        <button class="btn" id="btnTheme" title="라이트/다크 전환">테마</button>
        <input type="file" id="fileImport" accept=".json" hidden>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<div id="gate"><form class="box" id="gateForm" autocomplete="on">
  <h2>통합테스트 4차 시나리오 대시보드</h2>
  <p>팀 비밀번호와 이름을 입력하세요. 메모·결과는 작성자 이름과 함께 GitHub 저장소에 저장되어 팀 전체에 공유됩니다.</p>
  <label for="gName">이름 (작성자 표시용)</label><input type="text" id="gName" required maxlength="20" placeholder="예: 장현용">
  <label for="gPw">팀 비밀번호</label><input type="password" id="gPw" required autocomplete="current-password">
  <label for="gTok">GitHub 토큰 <span style="color:var(--ink3)">(메모·결과 작성자만 · 보기만 할 경우 비워두기)</span></label><input type="password" id="gTok" placeholder="github_pat_… (이 PC에만 저장)" autocomplete="off">
  <div class="row"><input type="checkbox" id="gRemember" checked><label for="gRemember" style="margin:0">이 PC에서 기억하기</label></div>
  <button class="btn primary" type="submit">입장</button>
  <div class="err" id="gErr"></div>

<script>
/* =====================================================================
   GitHub 저장 설정 — github.io 주소로 접속하면 owner/repo는 자동 인식됩니다.
   다른 주소로 서비스할 때만 owner, repo를 직접 입력하세요.
   메모·결과는 저장소의 별도 브랜치(branch)에 암호화된 state.json 으로 저장됩니다.
   ===================================================================== */
window.GH = { owner: '', repo: '', branch: 'dashboard-data', path: 'state.json',
              api: 'https://api.github.com', raw: 'https://raw.githubusercontent.com' };
</script>
<script>
(function(){
'use strict';
const LS = 'gerp_it4_1012_online_v1';
const lsGet = k=>{ try{ return localStorage.getItem(LS+'_'+k); }catch(e){ return null; } };
const lsSet = (k,v)=>{ try{ if(v==null) localStorage.removeItem(LS+'_'+k); else localStorage.setItem(LS+'_'+k, v); }catch(e){} };
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decrypt(pw){
  const E = JSON.parse(document.getElementById('enc-data').textContent);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(E.salt), iterations:E.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(E.iv)}, key, b64(E.ct));
  return {data: JSON.parse(new TextDecoder().decode(plain)), key};
}
const gate = document.getElementById('gate');
document.getElementById('gName').value = lsGet('name') || '';
document.getElementById('gTok').value = lsGet('tok') || '';
async function enter(name, pw, tok, remember, silent){
  const err = document.getElementById('gErr');
  try{
    if(!window.crypto || !crypto.subtle) throw new Error('crypto');
    const dk = await decrypt(pw);
    if(remember){ lsSet('pw', pw); } else { lsSet('pw', null); }
    lsSet('name', name); lsSet('tok', tok || null);
    gate.remove();
    window.startApp(dk.data, {name, key: dk.key, token: tok||''});
  }catch(e){
    if(!silent) err.textContent = (e && e.message==='crypto') ? '이 브라우저는 암호 해제를 지원하지 않습니다 (https 주소로 접속하세요).' : '비밀번호가 올바르지 않습니다.';
    if(silent) lsSet('pw', null);
  }
}
document.getElementById('gateForm').onsubmit = e=>{
  e.preventDefault();
  enter(document.getElementById('gName').value.trim(), document.getElementById('gPw').value,
        document.getElementById('gTok').value.trim(), document.getElementById('gRemember').checked, false);
};
const savedPw = lsGet('pw'), savedName = lsGet('name');
if(savedPw && savedName) enter(savedName, savedPw, lsGet('tok')||'', true, true);
window.__gate = {lsGet, lsSet};
})();
</script>
<script>
window.startApp = function(D, AUTH){
'use strict';
const LS_KEY = 'gerp_it4_1012_dashboard_v1';
const RESULTS = ['', 'Pass', 'Fail'];
const SYS_NORM = {'S/5 HANA':'S/4 HANA','S/6 HANA':'S/4 HANA','E-Accounting':'e-Accounting'};
const normSys = s => SYS_NORM[s] || s || '(미기재)';

/* ---------- state (memo / result) + 서버 동기화 ---------- */
// S.memo[key]=text, S.res[key]=Pass/Fail, S.meta[key]={by,at}  (key: 메모키 또는 'res:'+Activity키)
let S = {memo:{}, res:{}, meta:{}, since:''};
try{ const c = JSON.parse(localStorage.getItem(LS_KEY+'_cache')||'null'); if(c){ S = Object.assign(S, c); } }catch(e){}
let pending = {};
try{ pending = JSON.parse(localStorage.getItem(LS_KEY+'_pending')||'{}'); }catch(e){}
function cache(){ try{ localStorage.setItem(LS_KEY+'_cache', JSON.stringify(S)); localStorage.setItem(LS_KEY+'_pending', JSON.stringify(pending)); }catch(e){} }
/* ----- GitHub 저장소 연동 ----- */
const GH = Object.assign({}, window.GH);
if(!GH.owner && /\.github\.io$/i.test(location.hostname)){
  GH.owner = location.hostname.split('.')[0];
  GH.repo = location.pathname.split('/').filter(Boolean)[0] || (GH.owner + '.github.io');
}
const GH_OK = !!(GH.owner && GH.repo);
const CAN_WRITE = !GH_OK || !!AUTH.token;          // GitHub 미연결(로컬 파일)은 이 PC 저장 모드
const RO = !CAN_WRITE;
function setSync(cls, text){ const s=document.getElementById('syncstate'); s.className='sync '+cls; s.textContent=text; }
function setSaved(t){ document.getElementById('savestate').textContent = t; }
function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})+' '+d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }
const u8b64 = u8 => { let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); };
const b64u8 = s => Uint8Array.from(atob(s.replace(/\s/g,'')), c=>c.charCodeAt(0));
async function sealState(state){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, AUTH.key, new TextEncoder().encode(JSON.stringify(state))));
  return JSON.stringify({v:1, iv:u8b64(iv), ct:u8b64(ct)});
}
async function openState(text){
  const j = JSON.parse(text);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64u8(j.iv)}, AUTH.key, b64u8(j.ct));
  const s = JSON.parse(new TextDecoder().decode(pt)); s.items = s.items || {}; return s;
}
class GhErr extends Error{ constructor(status, msg){ super(msg||('HTTP '+status)); this.status=status; } }
const apiBase = () => `${GH.api}/repos/${GH.owner}/${GH.repo}`;
async function gh(method, path, body){
  const r = await fetch(apiBase() + path, {method, cache:'no-store', headers: Object.assign({'Accept':'application/vnd.github+json'},
      AUTH.token? {'Authorization':'Bearer '+AUTH.token}:{} , body? {'Content-Type':'application/json'}:{}), body: body? JSON.stringify(body): undefined});
  if(!r.ok){ let m=''; try{ m=(await r.json()).message; }catch(e){} throw new GhErr(r.status, m); }
  return r.status===204? null : r.json();
}
let branchReady = false;
async function ensureBranch(){
  if(branchReady) return;
  try{ await gh('GET', `/git/ref/heads/${encodeURIComponent(GH.branch)}`); }
  catch(e){
    if(e.status!==404) throw e;
    const repo = await gh('GET', ''); const base = await gh('GET', `/git/ref/heads/${encodeURIComponent(repo.default_branch)}`);
    await gh('POST', '/git/refs', {ref:'refs/heads/'+GH.branch, sha: base.object.sha});
  }
  branchReady = true;
}
async function readRemote(){                          // → {sha, state}
  if(AUTH.token){
    try{
      const j = await gh('GET', `/contents/${GH.path}?ref=${encodeURIComponent(GH.branch)}&t=${Date.now()}`);
      return {sha:j.sha, state: await openState(new TextDecoder().decode(b64u8(j.content)))};
    }catch(e){ if(e.status===404) return {sha:null, state:{items:{}}}; throw e; }
  }
  const r = await fetch(`${GH.raw}/${GH.owner}/${GH.repo}/${GH.branch}/${GH.path}?t=${Date.now()}`, {cache:'no-store'});
  if(r.status===404) return {sha:null, state:{items:{}}};
  if(!r.ok) throw new GhErr(r.status);
  return {sha:null, state: await openState(await r.text())};
}
function applyItems(items, full){
  let resChanged = false;
  Object.entries(items).forEach(([k, it])=>{
    if(pending[k]) return;                                    // 내가 저장 대기 중인 값이 우선
    const cur = S.meta[k];
    if(!full && cur && cur.at >= it.at) return;
    S.meta[k] = {by:it.by, at:it.at};
    const v = it.v || '';
    if(it.t==='res'){ const ak=k.slice(4); if((S.res[ak]||'')!==v){ if(v) S.res[ak]=v; else delete S.res[ak]; resChanged=true; } paintRes(ak); }
    else { if((S.memo[k]||'')!==v){ if(v) S.memo[k]=v; else delete S.memo[k]; paintMemo(k, it.by!==AUTH.name); } else paintMeta(k,false); }
  });
  cache();
  if(resChanged){ const a=document.activeElement; if(!(a && a.closest && a.closest('#panel-ov'))) renderOverview(); }
  refreshCounts();
}
function errText(e){
  if(!e || !e.status) return '연결 실패 · 재시도 예정';
  if(e.status===401) return '토큰 오류 (만료/오타) — 토큰 버튼에서 다시 등록';
  if(e.status===403) return (/rate limit/i.test(e.message)? 'GitHub 호출 한도 초과 · 잠시 후 재시도' : '쓰기 권한 없음 (토큰 권한 확인)');
  if(e.status===404) return '저장소를 찾을 수 없음 (저장소 이름·토큰 권한 확인)';
  return 'GitHub 오류 '+e.status+' · 재시도 예정';
}
function queue(k, type, value){
  if(RO) return;
  pending[k] = {k, type, value, label: labelOfKey(type==='res'? k.slice(4): k).join(' › ')};
  S.meta[k] = {by: AUTH.name, at: new Date().toISOString()};
  cache(); flushSoon();
}
let flushTimer = null, flushing = false;
function flushSoon(ms){ clearTimeout(flushTimer); if(GH_OK) setSync('busy','저장 대기…'); flushTimer = setTimeout(flush, ms==null?3000:ms); }
async function flush(){
  if(!GH_OK){ pending = {}; cache(); setSync('ok','이 PC에 저장됨 '+fmtTime(new Date().toISOString())+' (GitHub 미연결)'); return; }
  if(RO) return;
  const items = Object.values(pending); if(!items.length || flushing) return;
  flushing = true; setSync('busy','GitHub에 저장 중…');
  try{
    await ensureBranch();
    for(let attempt=0; ; attempt++){
      const {sha, state} = await readRemote();
      const now = new Date().toISOString();
      items.forEach(it=>{ state.items[it.k] = {t:it.type, v:it.value, by:AUTH.name, at:now, l:it.label}; });
      state.updated = now; state.by = AUTH.name;
      const body = {message: `[대시보드] ${AUTH.name} · ${items.length}건 수정`, branch: GH.branch,
                    content: u8b64(new TextEncoder().encode(await sealState(state)))};
      if(sha) body.sha = sha;
      try{ await gh('PUT', `/contents/${GH.path}`, body); }
      catch(e){ if((e.status===409 || e.status===422) && attempt<4){ await new Promise(r=>setTimeout(r, 400+Math.random()*800)); continue; } throw e; }
      items.forEach(it=>{ if(pending[it.k] && pending[it.k].value===it.value) delete pending[it.k]; S.meta[it.k]={by:AUTH.name, at:now}; paintMeta(it.k,false); });
      applyItems(state.items, false);
      break;
    }
    cache(); setSync('ok','GitHub 저장됨 '+fmtTime(new Date().toISOString()));
  }catch(e){ setSync('err', '저장 실패: '+errText(e)); }
  finally{ flushing = false; if(Object.keys(pending).length){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, 15000); } }
}
async function pull(full){
  if(!GH_OK){ setSync('ok', 'GitHub 미연결 · 이 PC에만 저장'); return; }
  try{
    const {state} = await readRemote();
    applyItems(state.items, full);
    if(!Object.keys(pending).length) setSync('ok', (RO? '보기 전용 · 최대 5분 지연 · ' : '동기화 ') + fmtTime(new Date().toISOString()));
  }catch(e){ setSync('err', '불러오기 실패: '+errText(e)); }
}
function paintMemo(k, remote){
  document.querySelectorAll(`textarea[data-memo="${CSS.escape(k)}"]`).forEach(t=>{
    if(document.activeElement===t){ paintMeta(k, true, '다른 사용자가 수정함 — 입력을 마치면 덮어씁니다'); return; }
    t.value = S.memo[k]||'';
  });

}
function paintRes(ak){
  document.querySelectorAll(`select[data-res="${CSS.escape(ak)}"]`).forEach(s=>{ s.value = S.res[ak]||''; s.className='res '+(s.value==='Pass'?'pass':s.value==='Fail'?'fail':''); s.title = metaText('res:'+ak); });

function metaText(k){ const m=S.meta[k]; return m? `${m.by} · ${fmtTime(m.at)}` : ''; }
function paintMeta(k, remote, override){
  document.querySelectorAll(`[data-mstamp="${CSS.escape(k)}"]`).forEach(s=>{

function startPolling(){

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function resStats(scnId, sections){

function treeHtml(nodes, depth){
  return nodes.map(n=>{
    if(n.c && n.c.length){
      return `<details class="lv${depth}" open><summary>${esc(n.t)}</summary><div class="kids">${treeHtml(n.c, depth+1)}</div></details>`;

function applyFilter(scope){
  const f = scope.querySelector('.filters'); if(!f) return;
  const q = f.querySelector('[data-q]').value.trim().toLowerCase();
  const sys = f.querySelector('[data-sys]').value, rs = f.querySelector('[data-rs]').value;
  let hits=0, tot=0; const active = q||sys||rs;
  scope.querySelectorAll('.sec').forEach(sec=>{
    let secHits=0; const title = sec.querySelector('.st');
    title.innerHTML = hl(title.textContent, q);
    const titleMatch = q && title.textContent.toLowerCase().includes(q);
    sec.querySelectorAll('tr.act').forEach(tr=>{
      tot++;
      const r = S.res[tr.dataset.k]||'';
      let ok = (!q || titleMatch || tr.dataset.text.includes(q)) && (!sys || tr.dataset.sys===sys) &&
        (!rs || (rs==='n'? !r : r===rs));
      tr.hidden = !ok; const det = tr.nextElementSibling; if(!ok) det.hidden = true; else if(tr.classList.contains('open')) det.hidden=false;
      const nm = tr.querySelector('td.nm'); if(nm){ nm.querySelectorAll('mark').forEach(m=>m.replaceWith(m.textContent)); if(q) highlightNode(nm,q); }
      if(ok){ hits++; secHits++; }
    });
    const hasActs = sec.querySelectorAll('tr.act').length>0;
    sec.classList.toggle('dim', active && secHits===0 && !(titleMatch && !hasActs));
    if(active && secHits>0) sec.classList.add('open');
  });
  f.querySelector('[data-hit]').textContent = active? `${hits} / ${tot} Activity 일치` : `Activity ${tot}건`;
}
function hl(text,q){ if(!q) return esc(text); const i=text.toLowerCase().indexOf(q); if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length)); }
function highlightNode(node,q){
  const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT); const list=[]; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(t=>{ const i=t.nodeValue.toLowerCase().indexOf(q); if(i<0) return; const r=document.createRange(); r.setStart(t,i); r.setEnd(t,i+q.length); const m=document.createElement('mark'); r.surroundContents(m); });
}

    <tr><td>E2E</td><td class="small">${esc(D.e2e.file)}</td><td class="small muted">E2E 시나리오 List, Script 작성 안내, E2E-001~011 (숨김 시트 포함), Code, Scenario 개요 예시</td></tr>
    </tbody></table>
    ${memoBox('ov::files','단락 메모 · 원천 파일 / 전체 코멘트')}
  </div>`;
  p.querySelectorAll('tr[data-go]').forEach(tr=>tr.onclick=()=>showTab(tr.dataset.go));
}

/* ---------- Module panels ---------- */
function renderModule(m){
  const p = document.getElementById('panel-'+m.id);
  const systems = [...new Set(allActs(m).map(x=>normSys(x.a.system)))].sort();
  const st = resStats(m.id, m.sections);
  p.innerHTML = `
  <div class="breadcrumb"><a data-home>종합 현황</a> › ${esc(m.id)} ${esc(m.name)}</div>
  <div class="card"><h2>1. Integration Test 개요 <span class="chip brand">${esc(m.id)}</span> <span class="chip">${esc(m.ver)}</span></h2>
    <dl class="meta-grid"><dt>Scenario ID</dt><dd><b>${esc(m.id)}</b></dd><dt>Biz. Scenario 명</dt><dd><b>${esc(m.name)}</b></dd>
      <dt>원천 파일</dt><dd class="small muted">${esc(m.file)}</dd>
      <dt>구성</dt><dd>단위업무 ${m.sections.length}개 · Activity ${st.t}건</dd>
      <dt>진행 현황</dt><dd style="max-width:420px">${barHtml(st)}</dd></dl>
    <div class="summary-box"><b>개요</b> · ${esc(m.summary)}</div>
    <div class="tree">${treeHtml(m.tree,1)}</div>
    ${memoBox(m.id+'::overview','단락 메모 · Scenario 개요')}
  </div>
  <div class="card"><h2>2. 시나리오 Script <span class="small muted">단위업무 ▸ Activity ▸ 상세 (행 클릭 시 상세 펼침)</span></h2>
    ${filtersHtml(m.id, systems)}
    <div class="secs">${sectionsHtml(m.id, m.sections)}</div>

  wirePanel(p);
}

/* ---------- E2E panel ---------- */
let e2eCurrent = null;
function renderE2E(){
  const p = document.getElementById('panel-E2E');
  const E = D.e2e;
  const ENT = ['한국','북경','광동','천진','염성','미국'];
  const groups = [...new Set(E.list.map(x=>x.group))];
  const sheetOf = id => E.sheets.find(s=>s.id===id);
  const listRows = groups.map(g=>`<tr class="grp-row"><td colspan="11">${esc(g)} <span class="small muted">(${E.list.filter(x=>x.group===g).length})</span></td></tr>` +
    E.list.filter(x=>x.group===g).map(x=>{ const sh = sheetOf(x.id)||{sections:[]}; const n = sh.sections.reduce((a,s)=>a+s.acts.length,0);
      return `<tr class="click" data-e2e="${x.id}"><td><b>${esc(x.id)}</b></td><td>${esc(x.target)}</td><td>${esc(x.partner)}${x.ic?' · '+esc(x.ic):''}</td>
      <td>${esc(x.domexp)}</td><td>${esc(x.prod)}</td><td>${esc(x.purch)||'–'}</td><td>${x.subcon?'●':''}</td><td>${esc(x.sys)}</td>
      <td><div class="dots">${ENT.map(e=>`<span class="dot ${x.ent.includes(e)?'':'off'}">${e}</span>`).join('')}</div></td>
      <td class="num">${n? '<span class="chip pass">'+n+'</span>' : '<span class="chip">미작성</span>'}</td><td>${sh.hidden?'<span class="chip">숨김</span>':'<span class="chip brand">표시</span>'}</td></tr>`;}).join('')).join('');
  p.innerHTML = `
  <div class="breadcrumb"><a data-home>종합 현황</a> › E2E 종합 시나리오 (CO)</div>
  <div class="card"><h2>E2E 시나리오 List <span class="small muted">(행 클릭 시 아래 Script로 이동)</span></h2>
    <div class="tbl-scroll"><table><thead><tr><th>E2E ID</th><th>대상 제품/서비스</th><th>거래처 / 사간거래</th><th>내수/수출</th><th>생산방식</th><th>구매자재</th><th>임가공</th><th>주요 연계 시스템</th><th>법인</th><th class="num">CO Activity</th><th>시트</th></tr></thead>
    <tbody>${listRows}</tbody></table></div>
    ${memoBox('E2E::list','단락 메모 · E2E 시나리오 List')}
  </div>
  <div class="card" id="e2eScript"><h2>E2E 시나리오 Script</h2>
    <div class="subtabs">${E.sheets.map(s=>{const n=s.sections.reduce((a,x)=>a+x.acts.length,0);return `<button data-sub="${s.id}">${esc(s.id)}<span class="cnt">${n?n:'–'}</span></button>`;}).join('')}</div>
    <div id="e2eBody"></div>
  </div>
  <div class="two">
    <div class="card"><h2>Script 작성 안내</h2>
      <ol class="small">${guideHtml(E.guide)}</ol>
      ${memoBox('E2E::guide','단락 메모 · Script 작성 안내')}
    </div>
    <div class="card"><h2>참고 · Scenario 개요 작성 예시 시트</h2>
      <div class="small muted" style="margin-bottom:8px">원본 시트명 “Scenario 개요_Module 시나리오만 작성” (예시: ${esc(E.sample.meta.id)} ${esc(E.sample.meta.name)})</div>
      <details><summary class="small" style="cursor:pointer">예시 내용 펼치기</summary>
        <div class="summary-box small"><b>개요</b> · ${esc(E.sample.meta.summary)}</div>
        <div class="tree small">${treeHtml(E.sample.tree,1)}</div></details>
      ${memoBox('E2E::sample','단락 메모 · 개요 작성 예시')}
    </div>
  </div>`;
  p.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>showE2E(b.dataset.sub));
  p.querySelectorAll('tr[data-e2e]').forEach(tr=>tr.onclick=()=>{showE2E(tr.dataset.e2e); document.getElementById('e2eScript').scrollIntoView({behavior:'smooth'});});
  wirePanel(p);
  const firstWritten = E.sheets.find(s=>s.sections.some(x=>x.acts.length)) || E.sheets[0];
  showE2E(firstWritten.id);
}
function guideHtml(g){
  // g: flat list — ['제목','1','text','*첨부','2','text',...]
  let out='', cur=null; g.slice(1).forEach(v=>{ if(/^\d+$/.test(v)){ if(cur) out+=cur+'</li>'; cur='<li>'; } else if(cur!==null){ cur += (cur==='<li>'? '<b>'+esc(v)+'</b>' : '<div class="muted">'+esc(v)+'</div>'); } });
  if(cur) out+=cur+'</li>'; return out;
}
function showE2E(id){
  const E = D.e2e; const sh = E.sheets.find(s=>s.id===id); const li = E.list.find(x=>x.id===id) || {};
  e2eCurrent = id;
  document.querySelectorAll('#panel-E2E [data-sub]').forEach(b=>b.classList.toggle('on', b.dataset.sub===id));
  const body = document.getElementById('e2eBody');
  const n = sh.sections.reduce((a,s)=>a+s.acts.length,0);
  const systems = [...new Set(allActs(sh).map(x=>normSys(x.a.system)))].sort();
  body.innerHTML = `
    <div class="e2e-head"><h3 style="margin:0">${esc(sh.id)} · ${esc(sh.title)}</h3>
      ${sh.hidden?'<span class="chip">원본 숨김 시트</span>':'<span class="chip brand">원본 표시 시트</span>'}
      <span class="chip ${n?'pass':''}">CO Activity ${n}</span><span class="chip">단위업무 ${sh.sections.length}</span></div>
    <dl class="meta-grid"><dt>서비스 Group</dt><dd>${esc(li.group||'')}</dd><dt>대상</dt><dd>${esc(li.target||'')}</dd>
      <dt>연계 시스템</dt><dd>${esc(li.sys||'')}</dd><dt>법인</dt><dd>${esc((li.ent||[]).join(', '))}</dd></dl>
    ${!n? `<div class="summary-box small">본 시나리오는 단위업무(Flow Chart Box) 틀만 구성되어 있고 CO Activity는 아직 작성되지 않았습니다. 단위업무별 메모란에 작성 필요 여부·담당을 기록할 수 있습니다.</div>`:''}
    ${memoBox(id+'::overview','단락 메모 · '+id+' 시나리오 전체')}
    <div style="height:12px"></div>
    ${n? filtersHtml(id, systems):''}
    <div class="secs">${sectionsHtml(id, sh.sections)}</div>`;
  wirePanel(body);
  if(n) body.querySelectorAll('.sec').forEach(s=>{ if(s.querySelector('tr.act')) s.classList.add('open'); });
}

/* ---------- wiring ---------- */
function wirePanel(root){
  root.querySelectorAll('[data-home]').forEach(a=>a.onclick=()=>showTab('ov'));
  root.querySelectorAll('.sec>.sh').forEach(h=>h.onclick=(e)=>{ if(e.target.closest('select')) return; h.parentElement.classList.toggle('open'); });
  root.querySelectorAll('tr.act').forEach(tr=>tr.onclick=()=>{ tr.classList.toggle('open'); tr.nextElementSibling.hidden = !tr.classList.contains('open'); });
  root.querySelectorAll('.filters').forEach(f=>{
    const scope = f.parentElement;
    f.querySelector('[data-q]').oninput = ()=>applyFilter(scope);
    f.querySelector('[data-sys]').onchange = ()=>applyFilter(scope);
    f.querySelector('[data-rs]').onchange = ()=>applyFilter(scope);
    f.querySelector('[data-exp]').onclick = ()=>scope.querySelectorAll('.sec').forEach(s=>s.classList.add('open'));
    f.querySelector('[data-col]').onclick = ()=>scope.querySelectorAll('.sec').forEach(s=>s.classList.remove('open'));
    applyFilter(scope);
  });
}
document.addEventListener('input', e=>{
  const t = e.target; if(!t.dataset || !t.dataset.memo || RO) return;
  const k = t.dataset.memo; if(t.value.trim()) S.memo[k]=t.value; else delete S.memo[k];
  document.querySelectorAll(`textarea[data-memo="${CSS.escape(k)}"]`).forEach(o=>{ if(o!==t) o.value=t.value; });
  paintMeta(k, false, '입력 중…');
  queue(k, 'memo', t.value.trim()? t.value : '');
  refreshCounts();
});
document.addEventListener('focusout', e=>{ if(e.target.dataset && e.target.dataset.memo && Object.keys(pending).length) flushSoon(300); });
document.addEventListener('change', e=>{
  const t = e.target; if(!t.dataset || !t.dataset.res || RO) return;
  const k = t.dataset.res; if(t.value) S.res[k]=t.value; else delete S.res[k];
  t.className = 'res ' + (t.value==='Pass'?'pass':t.value==='Fail'?'fail':'');
  queue('res:'+k, 'res', t.value); flushSoon(1500);
  renderOverview(); refreshCounts();
});
function refreshCounts(){
  let p=0,f=0,t=0;
  D.module.concat(D.e2e.sheets).forEach(m=>{const x=resStats(m.id,m.sections); p+=x.p; f+=x.f; t+=x.t;});
  const kr = document.getElementById('kpiRes'); if(kr) kr.innerHTML = `<span style="color:var(--pass)">${p}</span> / <span style="color:var(--fail)">${f}</span> / ${t-p-f}`;
  const km = document.getElementById('kpiMemo'); if(km) km.textContent = Object.values(S.memo).filter(v=>v.trim()).length;
  document.querySelectorAll('[data-mc]').forEach(td=>{ const c = memoCount(td.dataset.mc); td.textContent = c||''; });
  // refresh section header bars & memo chips without full re-render
  document.querySelectorAll('.sec').forEach(sec=>{
    const key = sec.dataset.sec; const has = (S.memo[key]||'').trim();
    const sh = sec.querySelector('.sh'); let chip = sh.querySelector('.chip.memo');
    if(has && !chip){ chip = el('<span class="chip memo">메모</span>'); sh.insertBefore(chip, sh.lastElementChild); }
    if(!has && chip) chip.remove();
    const sels = [...sec.querySelectorAll('select.res')];
    if(sels.length){ const st={p:0,f:0,t:sels.length}; sels.forEach(s=>{ if(s.value==='Pass')st.p++; else if(s.value==='Fail')st.f++; }); st.n=st.t-st.p-st.f; sh.lastElementChild.innerHTML = barHtml(st); }
  });
}

/* ---------- export / import ---------- */
function labelOfKey(k){
  const [scn, rest] = k.split(/::|#/);
  const all = D.module.concat(D.e2e.sheets);
  const sc = all.find(x=>x.id===scn);
  if(k.includes('#r')){ const row=+k.split('#r')[1]; for(const s of (sc?sc.sections:[])) for(const a of s.acts) if(a.row===row) return [scn, s.title, a.aid+' '+a.name]; return [scn,'','row '+row]; }
  const m = k.match(/::sec(\d+)$/); if(m && sc) return [scn, sc.sections[+m[1]].title, '(단락 메모)'];
  const map = {overview:'시나리오 개요', scenarios:'Module 시나리오 현황', system:'수행 System 분포', notes:'원천 데이터 점검 사항', files:'원천 파일/전체', list:'E2E 시나리오 List', guide:'Script 작성 안내', sample:'개요 작성 예시'};
  const t = k.split('::')[1]; return [scn==='ov'?'종합':scn, map[t]||t, '(단락 메모)'];
}
function download(name, text, type){
  const b = new Blob([text], {type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
}
const stamp = ()=>{const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');};
document.getElementById('btnCsv').onclick = ()=>{
  const keys = [...new Set(Object.keys(S.memo).concat(Object.keys(S.res)))];
  const q = v => '"'+String(v||'').replace(/"/g,'""')+'"';
  const lines = [['시나리오','단락','항목','결과','결과 입력자','메모','메모 작성자'].map(q).join(',')];
  keys.sort().forEach(k=>{ const [a,b,c]=labelOfKey(k); lines.push([a,b,c,S.res[k]||'',metaText('res:'+k),S.memo[k]||'',metaText(k)].map(q).join(',')); });
  download('통테4차_메모_'+stamp()+'.csv', '\ufeff'+lines.join('\r\n'), 'text/csv;charset=utf-8');
};
document.getElementById('btnJson').onclick = ()=> download('통테4차_메모백업_'+stamp()+'.json', JSON.stringify({memo:S.memo,res:S.res,meta:S.meta},null,1), 'application/json');
document.getElementById('btnImport').onclick = ()=>{ if(RO){ alert('불러오기는 편집 권한(토큰)이 있을 때 가능합니다.'); return; } document.getElementById('fileImport').click(); };
document.getElementById('fileImport').onchange = e=>{
  const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = ()=>{ try{ const j = JSON.parse(r.result);
      Object.entries(j.memo||{}).forEach(([k,v])=>{ if((S.memo[k]||'')!==v){ S.memo[k]=v; queue(k,'memo',v); } });
      Object.entries(j.res||{}).forEach(([k,v])=>{ if((S.res[k]||'')!==v){ S.res[k]=v; queue('res:'+k,'res',v); } });
      renderAll(); setSaved('불러오기 완료 · 서버 저장 중'); }catch(err){ setSaved('불러오기 실패'); } };
  r.readAsText(f); e.target.value='';
};
document.getElementById('btnSync').onclick = ()=>{ flush(); pull(true); };
document.getElementById('btnUser').onclick = ()=>{
  if(!confirm('로그아웃하고 이름/비밀번호를 다시 입력할까요?')) return;
  window.__gate.lsSet('pw', null); location.reload();
};
document.getElementById('btnToken').onclick = ()=>{
  const cur = AUTH.token ? '(등록됨 — 비우고 확인하면 해제)' : '';
  const v = prompt('GitHub 토큰 (Fine-grained, 이 저장소 Contents: Read and write)\n이 PC 브라우저에만 저장됩니다. ' + cur, '');
  if(v===null) return;
  window.__gate.lsSet('tok', v.trim() || null); location.reload();
};
document.getElementById('modeChip').textContent = !GH_OK ? '로컬 모드' : (RO ? '보기 전용' : '편집 가능');
document.getElementById('modeChip').className = 'chip ' + (RO ? '' : 'pass');
document.getElementById('btnExpand').onclick = ()=> document.querySelectorAll('.panel.on .sec').forEach(s=>s.classList.add('open'));
document.getElementById('btnCollapse').onclick = ()=> document.querySelectorAll('.panel.on .sec').forEach(s=>s.classList.remove('open'));
document.getElementById('btnTheme').onclick = ()=>{
  const r = document.documentElement; const cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.dataset.theme = cur==='dark'?'light':'dark'; try{ localStorage.setItem(LS_KEY+'_theme', r.dataset.theme); }catch(e){}
};
try{ const th = localStorage.getItem(LS_KEY+'_theme'); if(th) document.documentElement.dataset.theme = th; }catch(e){}

/* ---------- boot ---------- */
function renderAll(){
  renderOverview(); D.module.forEach(renderModule); renderE2E(); refreshCounts();
}
document.getElementById('subline').textContent = `원천: 통테4차(10.12) 폴더 엑셀 ${D.module.length+1}개 · 데이터 기준 ${D.generated}`;
document.getElementById('userName').textContent = AUTH.name;
renderAll();
let startTab = 'ov'; try{ startTab = localStorage.getItem(LS_KEY+'_tab') || 'ov'; }catch(e){}
if(!TABS.some(t=>t.id===startTab)) startTab='ov';
showTab(startTab);
setSaved('');
if(Object.keys(pending).length) flushSoon(300);
pull(true).then(()=>{ startPolling(); if(GH_OK && AUTH.token) ensureBranch().catch(e=>setSync('err', errText(e))); });
window.addEventListener('beforeunload', e=>{ if(Object.keys(pending).length){ flush(); e.preventDefault(); e.returnValue=''; } });
};
</script>
